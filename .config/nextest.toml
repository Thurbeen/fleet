# cargo-nextest's settings for the Rust workspace, read by `cargo xtask check rust-test`.
#
# A hung test fails instead of holding a runner: nextest kills it, and the
# process group it started, once it has run for `period` times `terminate-after`.
# Neither the default profile nor `ci` retries a failure, because a retry that
# passes turns a flaky test green.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# `ci` is the profile the gate runs, locally and in CI alike. It runs every
# test even after one fails, so a single run reports all the failures.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"
