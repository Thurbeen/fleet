<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">How a Fleet Task runs</title>
<desc id="desc">A retro first-person-shooter status screen showing the six steps of one Fleet v2 Task. 1, apply: you or VEGA store a Task with fleet apply. 2, reconcile: fleet up holds the manager lease, and the pure Task controller plans each step, which the manager persists as an intent before the effect and a receipt after it. 3, spawn: the thurbox runtime starts the agent session in its own worktree. 4, brief: the brief is delivered once, by key; messages from fleet send queue in the Task inbox. 5, declare: the worker opens a change and runs fleet declare; a ChangeRequest mirrors it on the forge, and reviews and CI are relayed back to the inbox. 6, result: fleet result concludes the Task, and fleet delete releases the session. A status bar cycles through the Task phases Pending, Spawning, Spawned, Briefed, Concluded and Releasing.</desc>
