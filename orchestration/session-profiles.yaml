# How a worker session STARTS — as opposed to where its work goes.
#
# The rest of the control plane decides PLACEMENT: which repo, which branch,
# which host, which repos a session spans. That is spelled on the
# `thurbox-cli session create` command line and it varies per run. This file
# holds the other half — the settings that shape the agent itself, which do
# not vary per run and are worth reviewing in a diff.
#
# `./scripts/session-flags.sh <profile>` renders one profile into the
# `--env` / `--command` / `--arg` / `--reports-as` flags `session create`
# takes. `.agents/skills/thurbox-session/SKILL.md` shows the call.
#
# THIS FILE IS THE TEMPLATE'S. Tune a profile in
# `orchestration/session-profiles.local.yaml` instead — same schema, gitignored,
# and a profile it names replaces the one of that name here, wholesale. Editing
# THIS file puts a commit on `main` and costs you the clean fast-forward that
# `./scripts/update-from-template.sh` depends on; .gitignore's header says why.
# Both files are held to the convention and the two rules below.
#
# ONE CONVENTION, then TWO RULES THE GATE ENFORCES. The distinction is real:
# ./scripts/check.sh cannot detect a secret and does not try, so only the two
# numbered rules below stop a file reaching `main`.
#
# THE CONVENTION: this file holds template DEFAULTS, nothing
# environment-specific. It is committed and world-readable in a public
# template, so put in it only what you would be happy to read in a code review.
# It is a convention rather than a gate, and it has an obvious home rather than
# just a prohibition: `session-profiles.local.yaml` is gitignored, so a value
# you would not commit goes THERE. Nothing forces the point either, because
# nothing a running fleet writes is tracked at all — an instance has no
# changes of its own to push. A real credential is better still reaching the
# worker by inheritance: it inherits the environment of the thurbox server that
# spawns it, so your shell profile, your keyring or the agent's own login
# (`claude /login`, `gh auth login`) never puts it in a file at all.
#
# 1. NO `THURBOX_*` KEYS. thurbox's own identity variables always win over
#    `--env`, so a `THURBOX_SESSION` here would be silently ignored — the
#    worst kind of setting, one that looks applied and is not. The renderer
#    refuses the key rather than emitting a flag that does nothing.
#
# 2. `command` REQUIRES `reports_as`. thurbox reads hook coverage against a
#    `--command` session's file stem, so a session launched as
#    `/bin/sh -c 'exec claude'` reports coverage `none` and renders as
#    `uncovered` while the agent inside it is working. `--reports-as` is the
#    declaration that fixes it. The renderer refuses one without the other.
#
# Schema, per profile — every key optional:
#
#   env:         KEY: VALUE map          -> --env KEY=VALUE (repeated)
#   command:     an executable           -> --command
#   args:        list, in order          -> --arg (repeated); needs command
#   reports_as:  the agent in the pane   -> --reports-as; required by command
#
# A profile carrying `command` replaces `--agent`; thurbox refuses both.

profiles:
  # The profile a run uses when it has no reason to pick another. Empty on
  # purpose: a fresh clone inherits whatever environment the thurbox server
  # has, which is what it did before this file existed.
  default:
    env: {}

  # Worked example — a sweep of small, repetitive edits across many repos,
  # where thinking budget is the thing worth turning down. Both variables are
  # Claude Code's own. Delete it, rename it, or replace its contents; nothing
  # in the repo requires a profile of this name.
  sweep:
    env:
      MAX_THINKING_TOKENS: "8000"
      BASH_DEFAULT_TIMEOUT_MS: "120000"

  # THE FLAG HALF OF TRUST. Most agents ask about a directory they have not
  # seen with a DIALOG, which `scripts/session-trust.sh` answers with a
  # keystroke as part of every dispatch. Two do not: they take a launch flag,
  # and a launch flag is exactly what a profile is for.
  #
  # NOT EXERCISED HERE — neither binary is installed on the machine this was
  # written on, so these are wired from the flag names and thurbox's own
  # `cursor-agent` command, not from a session anyone watched start. Check the
  # flag against your installed version before trusting a wave to it.
  # `reports_as` is mandatory beside `command` and the gate enforces it.
  cursor-trusted:
    command: cursor-agent
    args: ["--trust"]
    reports_as: cursor

  muse-trusted:
    command: muse
    args: ["--yolo"]
    reports_as: muse
