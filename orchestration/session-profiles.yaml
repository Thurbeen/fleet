# How a worker session STARTS — as opposed to where its work goes.
#
# The rest of the control plane decides PLACEMENT: which repo, which branch,
# which host, which repos a session spans. That is spelled on the
# `thurbox-cli session create` command line and it varies per run. This file
# holds the other half — the settings that shape the agent itself, which do
# not vary per run and are worth reviewing in a diff.
#
# `uv run fleet session-flags <profile>` renders one profile into the
# `--env` / `--command` / `--arg` / `--reports-as` flags `session create`
# takes, and `fleet queue dispatch` renders a task's profile in-process.
# `.agents/skills/thurbox-session/SKILL.md` shows the call.
#
# ONE FILE, ONE LAYER. Every profile there is lives here, and this file is
# yours to edit. There used to be a gitignored `.local.yaml` overlay beside it;
# it existed so a profile could be tuned without touching a tracked file, which
# stopped mattering when this stopped being a template anyone pulls from.
#
# ONE CONVENTION, then TWO RULES THE GATE ENFORCES. The distinction is real:
# `uv run fleet check` cannot detect a secret and does not try, so only the two
# numbered rules below stop a file reaching `main`.
#
# THE CONVENTION: nothing environment-specific in here. This file is committed
# and this repo is PUBLIC, so put in it only what you would be happy to read in
# a code review. It is a convention rather than a gate, and it has an obvious
# answer rather than just a prohibition: a real credential should reach the
# worker by inheritance instead. A worker inherits the environment of the
# thurbox server that spawns it, so your shell profile, your keyring or the
# agent's own login (`claude /login`, `gh auth login`) puts it in no file here
# at all.
#
# 1. NO `THURBOX_*` KEYS. thurbox's own identity variables always win over
#    `--env`, so a `THURBOX_SESSION` here would be silently ignored — the
#    worst kind of setting, one that looks applied and is not. The renderer
#    refuses the key rather than emitting a flag that does nothing.
#
# 2. `command` REQUIRES `reports_as` OR `uncovered`. thurbox reads hook
#    coverage against a `--command` session's file stem, so a session
#    launched as `/bin/sh -c 'exec claude'` reports coverage `none` and
#    renders as `uncovered` while the agent inside it is working.
#    `--reports-as` is the declaration that names the family and fixes it.
#    `uncovered: true` is the other declaration: this command has no hook
#    family, the session will be uncovered, and that is accepted. Silence
#    — neither key — is still refused. That is the setting that looks
#    applied and is not. Both keys together are refused: pick one.
#
# Schema, per profile — every key optional:
#
#   env:         KEY: VALUE map          -> --env KEY=VALUE (repeated)
#   command:     an executable           -> --command
#   args:        list, in order          -> --arg (repeated); needs command
#   reports_as:  the agent in the pane   -> --reports-as; with command,
#                                          unless uncovered
#   uncovered:   true                    -> no --reports-as; with command,
#                                          instead of reports_as
#
# A profile carrying `command` replaces `--agent`; thurbox refuses both.

profiles:
  # The profile a run uses when it has no reason to pick another. Empty on
  # purpose: a worker then inherits whatever environment the thurbox server
  # has, which is what it did before this file existed.
  default:
    env: {}

  # Worked example — a sweep of small, repetitive edits across many repos,
  # where thinking budget is the thing worth turning down. Both variables are
  # Claude Code's own. Delete it, rename it, or replace its contents; nothing
  # in the repo requires a profile of this name.
  sweep:
    env:
      MAX_THINKING_TOKENS: "8000"
      BASH_DEFAULT_TIMEOUT_MS: "120000"

  # Pin the worker to Opus, for work where the reasoning is the expensive part
  # rather than the edit — a subsystem change with an invariant to preserve.
  #
  # AN ENV VAR AND NOT `args`, on purpose. `args` REPLACES the stock agent's
  # arguments rather than adding to them, and thurbox's stock `claude` entry
  # carries `--settings <config>/hooks/claude.json` — the file that lets an
  # agent report working/blocked/done/idle. Pinning the model with
  # `args: ["--model", ...]` therefore trades away hook coverage silently: the
  # session reports `uncovered`, and `watch`, `reap` and `refuel` each read it
  # wrong. `529e7bc` fixed exactly that on the lead. `ANTHROPIC_MODEL` reaches
  # the same setting through the environment and leaves the launch flags alone.
  opus:
    env:
      ANTHROPIC_MODEL: "claude-opus-5"

  # A LAUNCH FLAG INSTEAD OF A DIALOG. Most agents ask about a directory
  # they have not seen with a DIALOG, which `fleet session-trust` answers
  # with a keystroke as part of every dispatch. Two take a flag on the
  # command line instead, and a flag is exactly what a profile is for.
  # They are not the same flag: `--trust` answers cursor's dialog;
  # `--yolo` is something else (see muse-trusted).
  #
  # cursor-agent, measured 2026-09-18 on 2026.09.08-6caf4ff: `--trust`
  # answers the dialog, so `fleet session-trust` is not needed. The binary
  # has no `--settings` flag. thurbox ships no status hooks for `cursor`,
  # and `hook_schema` can only name a foreign family (practically
  # `claude`), which would wire `--settings` the binary does not take.
  # `uncovered: true` is the declaration that replaces `reports_as` here.
  #
  # An uncovered session: `refuel` will not touch it, `watch` will not
  # read its state, `reap` is by hand. `collect` is unchanged — it reads
  # `result.md`, not the session state. `dispatch` says this on the spawn.
  #
  # Manual recipe if dispatch is not the path: `session create --command
  # cursor-agent --arg --trust` (no `--reports-as`), then
  # `fleet queue attach` and `session send`.
  cursor-trusted:
    command: cursor-agent
    args: ["--trust"]
    uncovered: true

  # Same uncovered shape for Muse Code (Meta's terminal agent; beta since
  # 2026-08-05), which thurbox also does not cover. `--yolo` is NOT the
  # analogue of cursor's `--trust`: it is an alias of `--disable-approval`
  # and drops both confirmations and the sandbox at once. The vendor's
  # recommendation is a one-off isolated container only. The binary was
  # not run here, so these flags have not been watched to start a session.
  muse-trusted:
    command: muse
    args: ["--yolo"]
    uncovered: true
