# WHICH AGENT THE FLEET RUNS, and whose quota window gates a restart — the
# tracked copy, and it names none.
#
# COPY IT TO `agent.conf` BESIDE THIS FILE TO SET EITHER. That copy is
# gitignored, like `publish.conf` and `auto-merge.conf` beside it: which agent
# you dispatch is a property of you, not of this repo.

# --- THE AGENT ----------------------------------------------------------------
#
# Passed as `--agent` on every spawn fleet makes, unless the task names its own
# with `uv run fleet queue add --agent`.
#
# EMPTY IS THE DEFAULT AND MEANS "thurbox's". `agents.toml` already records the
# operator's choice and `session create` already honours it, so a name here is
# a second copy of that answer — set one only to make the fleet's workers
# differ from the rest of your sessions.
AGENT=

# --- THE ACCOUNT `refuel` GATES ON --------------------------------------------
#
# `fleet queue refuel` restarts nothing while the account's quota window is
# spent: a resumed worker would hit the same wall within seconds and burn the
# reset everyone is waiting for. The window belongs to a PROVIDER, and reading the
# wrong one is worse than reading none — a spent window on a provider the fleet
# never dispatches through must not strand a worker at its limit.
#
# EMPTY MEANS FLEET DOES NOT GUESS. `refuel` then reads the provider off the
# tasks it is about to act on: one agent across them all and it uses that, no
# agreement and it reports `undetermined`, which restarts nothing and says why.
# Set a name to gate on one provider regardless.
#
# `uv run fleet status --fuel` is unaffected either way: the screen reads
# every authenticated provider, so it can legitimately show a picture this
# setting disagrees with.
FUEL_PROVIDER=

# --- TEACHING FLEET AN AGENT IT HAS NOT WATCHED -------------------------------
#
# `fleet queue refuel` restarts a worker only on a CONJUNCTION: a `working`
# state gone stale AND the agent itself saying it hit a limit. The second half
# is agent-specific by nature — a banner on the pane, or a rate-limit record in a
# transcript — so `scripts/lib/queue.py` keeps one entry per agent fleet has
# actually WATCHED do it, the same way `scripts/lib/session_trust.py` keeps one
# entry per agent's trust dialog.
#
# AN AGENT WITH NO ENTRY IS NOT GUESSED AT: refuel reports it `undetermined`,
# which restarts nothing, and names these two settings. Inventing a pattern for
# an agent nobody has watched hit its limit is how a live worker gets restarted
# mid-turn.
#
# `LIMIT_BANNER` is a case-insensitive regex matched against the last lines of
# the pane. Match the SENTENCE, not the whole line, so a window name and a
# reset time can vary:
#
#     LIMIT_BANNER=you'?ve hit your \w+ limit
#
# `TRANSCRIPT_DIR` is a directory of per-session records named
# `<agent_session_id>.jsonl`, one JSON object per line, where the rejected turn
# carries `error: "rate_limit"`. It outranks the banner where it can be read,
# being the same event recorded rather than rendered. Leave it empty for an
# agent that keeps no such file and the banner answers alone.
#
# Both apply to whichever agent your workers run. Fleet ships the `claude`
# entry because that is the one it has observed; if you have watched another
# agent hit its limit, these two lines are the whole of teaching it.
LIMIT_BANNER=
TRANSCRIPT_DIR=

# --- ITS TRUST DIALOG, WHICH IS THE OTHER HALF OF THE SAME PROBLEM ------------
#
# `uv run fleet session-trust` answers the "do you trust this folder" dialog
# before a brief is typed, because sending a prompt into that dialog is how
# every fleet-spawned worker used to break. Its table carries one row per agent
# fleet has watched, and an agent that is not in it is REFUSED rather than
# guessed at — the row for Claude Code is why: its default selection is "No,
# exit", so a bare Enter kills the agent.
#
# These two teach it yours. `TRUST_SIGNATURE` is a case-insensitive regex
# matched against the pane; make it specific enough that ordinary agent output
# cannot produce it. `TRUST_KEYS` is the space-separated key sequence that
# accepts, defaulting to `enter`:
#
#     TRUST_SIGNATURE=do you trust the contents of this directory
#     TRUST_KEYS=down enter
#
# `TRUST_KEYS=none` is the other answer: this agent shows no dialog at all, so
# there is nothing to answer and the session is only confirmed as up. An agent
# whose trust is a LAUNCH FLAG rather than a keystroke is neither — put the
# flag in an `orchestration/session-profiles.yaml` profile instead.
TRUST_SIGNATURE=
TRUST_KEYS=

# --- WHEN THE AGENT AND ITS PROVIDER ARE NAMED DIFFERENTLY --------------------
#
# `refuel` reads the quota of the PROVIDER behind the agent in hand. quota-axi
# names most providers after that agent, so the default is IDENTITY and this is
# empty. Set pairs where they come apart:
#
#     AGENT_PROVIDERS=codex=openai,my-wrapper=anthropic
#
# Fleet carries no list of providers. `quota-axi auth` is asked which ones this
# machine holds a credential for, so the set grows with the tool — and a
# provider it does not name is reported by name rather than read past, because
# gating on the WRONG window is worse than gating on none.
AGENT_PROVIDERS=

# --- SAYING ANY OF THE ABOVE ABOUT ONE AGENT ----------------------------------
#
# Everything above is a fact about an AGENT, and this file held one answer per
# checkout. So a fleet that dispatches two agents — or, the case that forced
# this, the SECOND ACCOUNT of one agent, running under a name of its own —
# could describe exactly one of them, and serving the other meant editing these
# lines before each dispatch and putting them back afterwards.
#
# PUT THE AGENT IN FRONT OF THE KEY, the way `AGENT_PROVIDERS` above already
# puts it in front of a provider. No sections and no second file: a line with
# no dot is what it always was.
#
#     my-agent-spare.LIKE=my-agent
#     my-agent-spare.ENV=AGENT_CONFIG_DIR=~/.my-agent-spare
#
# `LIKE` says this agent IS that one, under another account. It is what hands
# it the built-in row of the agent fleet has WATCHED — the limit signal in
# `scripts/lib/queue.py`, the trust dialog in `scripts/lib/session_trust.py` —
# instead of fleet guessing one for a name it has never seen. It also settles
# the provider, so a second account needs no `AGENT_PROVIDERS` entry of its own.
#
# `ENV` is the account, as the environment variables that select it: comma
# separated `NAME=VALUE` pairs, `~` expanded. ONE record, read by both things
# that need it — the directory an agent's transcripts are in, and the
# environment `quota-axi` is run under to read that account's window. It is
# what lets two workers on one provider and two logins be judged each by their
# own window instead of both by whichever account the lead is signed in to.
#
# The four settings above can each be named this way too:
#
#     other-agent.TRUST_SIGNATURE=do you trust the contents of this directory
#     other-agent.TRUST_KEYS=enter
#     other-agent.LIMIT_BANNER=quota exhausted for this workspace
#     other-agent.TRANSCRIPT_DIR=/var/log/other-agent/sessions
#
# WHICH WINS: the agent's own line, then the line of whatever it is `LIKE`,
# then the plain setting above. More specific wins, and a checkout with no
# dotted line reads exactly what it read before there were any.
#
# TRACKED AND NAMING NOTHING, like every setting in this file: the lines above
# are comments and this section sets nothing.
