# The repositories fleet is allowed to MERGE in unattended, and this is the
# tracked copy of them — which is why it names none.
#
# COPY IT TO `auto-merge.conf` BESIDE THIS FILE TO NAME ANY. That copy is
# gitignored, the same way `registry/owners.txt`, `voice.conf` and
# `session-glyphs.conf` are, and for the same reason stated harder: WHICH
# REPOSITORIES YOU MAY MERGE IN IS A PROPERTY OF YOU, NOT OF THIS REPO. This
# one is public and agnostic — it is machinery anybody can run — so an operator
# who clones it must never inherit another operator's merge rights, and an
# operator who adds their own must never push them back. `scripts/queue.sh
# shepherd` reads THIS file when the copy is absent, so a fresh clone merges
# NOTHING until somebody says otherwise, and that silence is the correct
# default rather than an omission.
#
# THE HISTORY THIS FILE EXISTS TO CLOSE. The set used to be a literal in
# `scripts/lib/queue.py`, so every repository an operator wanted merged was a
# commit in a public repository naming that operator's projects — and the
# fourth such commit is what made the mistake obvious. Nothing about the gates
# below changed; only where the answer lives did.
#
# NO RE-INSTALL AND NO RESTART. Unlike `voice.example.conf` and
# `session-glyphs.example.conf`, nothing renders this: `shepherd` reads it on
# every pass, so an edit here takes effect on the next one.
#
# --- THE FORMAT ---------------------------------------------------------------
#
# One repository per line, HOST-QUALIFIED — `github.com/owner/repo`,
# `gitlab.example.com/group/sub/repo`. Blank lines and everything after a `#`
# are ignored, the same as `registry/owners.txt`.
#
# An entry that names no host is REFUSED with a line on stderr rather than
# matched against a bare `owner/repo`: `Thurbeen/fleet` is a different
# repository on github.com and on a self-hosted instance, and this is the one
# list where matching the wrong one means acting on somebody else's code.
#
# `FLEET_AUTO_MERGE_REPOS` in the environment REPLACES what is here rather than
# adding to it — a fleet driving somebody else's repositories is a different
# fleet, not this one plus an extra.
#
# --- WHAT PUTTING A REPOSITORY HERE MEANS -------------------------------------
#
# Not "merge everything in it". A pull request there is merged unattended only
# when ALL of these hold, and `scripts/lib/queue.py` is where they are enforced:
#
#   - its head branch lives IN that repository — a fork is reported, never
#     merged, because a stranger cannot create a branch inside your repo;
#   - its body carries a `no-mistakes` attestation naming its CURRENT head
#     commit, so a stale attestation from an earlier push cannot authorise the
#     push that replaced it;
#   - every check has CONCLUDED and passed;
#   - the forge itself calls it mergeable;
#   - whoever opened it can push there.
#
# So the test for adding a repository is whether those gates MEAN anything in
# it: a repo with its own `.no-mistakes.yaml` and its own CI has a pipeline
# behind the attestation gate and checks behind the checks gate. A repo with
# neither is one where every gate but the last is vacuous — that is the test,
# not whether your fleet happens to have work there.
#
# Fleet merges by SQUASH and by nothing else. A repository whose remote forbids
# squash produces a recorded refusal on every pass rather than a merge by some
# other method, so check that before adding one.
#
# --- YOUR REPOSITORIES --------------------------------------------------------
#
# Uncomment and edit in your own copy. Nothing is enabled here, and
# `./scripts/check.sh queue` fails this file if anything ever is.

# github.com/your-name/your-repo
# github.com/your-org/another-repo
