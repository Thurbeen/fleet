# The mark fleet's sessions wear in the thurbox session list — ONE setting,
# read in two places, and this is the tracked copy of it.
#
# COPY IT TO `session-glyphs.conf` BESIDE THIS FILE TO CHANGE ANYTHING. That
# copy is gitignored, the same way `registry/owners.txt` is: it is a property of
# your terminal and your font, not of this repo. Both readers fall back to THIS
# file when it is absent, so the defaults below need no copy at all — and an
# operator who edited a tracked file instead would hand `scripts/sync-checkout.sh`
# a dirty tree, which it refuses to fast-forward.
#
# WHY A SETTING AND NOT A LITERAL. thurbox has no per-session icon field —
# `ExtensionSession` carries `name`, `agent` and `repo_path`, and `session
# create` has no icon flag — so a session that wants a mark can only wear it in
# its NAME. That makes the glyph part of a string other things resolve, and
# `extension.toml.in`'s RENAMING header is the whole argument about what that
# costs. A switch is what keeps the cost reversible.
#
# THE HAZARD THE SWITCH EXISTS FOR, stated once here and not repeated at each
# reader: `📡` is U+1F4E1 and `🚀` is U+1F680, both East_Asian_Width WIDE — TWO
# terminal cells, not one. Everything in this repo that measures a name uses the
# same `unicode-width` table the painter lays out with, so the width is counted
# correctly on this side. What no setting here can control is the far side: a
# terminal font that draws a wide glyph narrow, or a multiplexer that disagrees
# about its width, shears every column after it in the session list. That is a
# property of your terminal, which is why the answer is `GLYPHS=off` and not a
# patch.
#
# NO VARIATION SELECTOR AND NO ZERO-WIDTH JOINER, in any value below. Both
# glyphs are Emoji_Presentation=Yes on their own, so nothing here needs U+FE0F
# to render in colour — and a selector adds a character some terminals count as
# a column and others do not, which is the shearing above with an extra step.
# `./scripts/check.sh pane` fails a value that carries one.

# --- THE SETTING --------------------------------------------------------------
#
# `on`  the emoji marks: the lead wears LEAD_GLYPH_ON, every worker fleet
#       spawns wears WORKER_GLYPH_ON.
# `off` the way back: the lead wears LEAD_GLYPH_OFF, which is one cell and not
#       an emoji, and workers wear nothing at all. That is exactly the naming
#       this control plane had before the glyphs existed.
#
# One setting and not two, deliberately. The reason to turn a glyph off is that
# this terminal renders wide characters badly, and that is true of both marks or
# of neither.
GLYPHS=on

# --- THE VOCABULARY IT CHOOSES BETWEEN ----------------------------------------
#
# Not three more settings: the two words `GLYPHS` selects, spelled here so that
# `off` is a supported value with a glyph of its own rather than a commented-out
# relic. Changing one of these IS a rename of the lead — see
# `extension.toml.in`'s RENAMING header for the sequence that applies it, which
# is not the same thing as installing it.
#
# `⌖` is U+2316 POSITION MARKER: East_Asian_Width Neutral, so one cell, and not
# an emoji, so it needs no colour font. It is what the lead wore for as long as
# it had a mark, and it is the reason `off` still leaves the lead marked while
# it leaves workers plain — the lead is a session you pick out of a list, and a
# worker is one of twenty.
LEAD_GLYPH_ON=📡
LEAD_GLYPH_OFF=⌖
WORKER_GLYPH_ON=🚀
