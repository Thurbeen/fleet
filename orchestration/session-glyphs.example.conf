# The mark fleet's sessions wear in the thurbox session list — ONE setting,
# read by two modules, and this is the tracked copy of it.
#
# COPY IT TO `session-glyphs.conf` BESIDE THIS FILE TO CHANGE ANYTHING. That
# copy is gitignored, the same way `registry/owners.txt` is: it is a property of
# your terminal and your font, not of this repo. Both readers fall back to THIS
# file when it is absent, so the defaults below need no copy at all — and an
# operator who edited a tracked file instead would hand `fleet sync-checkout` a
# dirty tree, which it refuses to fast-forward.
#
# WHY A SETTING AND NOT A LITERAL. thurbox has no per-session icon field —
# `ExtensionSession` carries `name`, `agent` and `repo_path`, and `session
# create` has no icon flag — so a session that wants a mark can only wear it in
# its NAME. That makes the glyph part of a string other things resolve, and
# `extension.toml.in`'s RENAMING header is the whole argument about what that
# costs. A switch is what keeps the cost reversible.
#
# THE HAZARD THE SWITCH EXISTS FOR, stated once here and not repeated at each
# reader: every emoji below is East_Asian_Width WIDE — TWO terminal cells, not
# one. Everything in this repo that measures a name uses the same
# `unicode-width` table the painter lays out with, so the width is counted
# correctly on this side. What no setting here can control is the far side: a
# terminal font that draws a wide glyph narrow, or a multiplexer that disagrees
# about its width, shears every column after it in the session list. That is a
# property of your terminal, which is why the answer is `GLYPHS=off` and not a
# patch.
#
# NO VARIATION SELECTOR AND NO ZERO-WIDTH JOINER, in any value below. Every
# glyph here is one code point and Emoji_Presentation=Yes on its own, so
# nothing here needs U+FE0F to render in colour — and a selector adds a
# character some terminals count as a column and others do not, which is the
# shearing above with an extra step.
# `uv run fleet check pane` fails a value that carries one.

# --- THE SETTING --------------------------------------------------------------
#
# `on`  the emoji marks: the lead wears LEAD_GLYPH_ON, and every other session
#       fleet spawns wears the one its KIND names — a queue worker
#       WORKER_GLYPH_ON, the machine sweep DIAGNOSE_GLYPH_ON, the maintainer's
#       review REVIEW_GLYPH_ON.
# `off` the way back: the lead wears LEAD_GLYPH_OFF, which is one cell and not
#       an emoji, and every other session wears nothing at all. That is exactly
#       the naming this control plane had before the glyphs existed.
#
# One setting and not four, deliberately. The reason to turn a glyph off is that
# this terminal renders wide characters badly, and that is true of every mark
# here or of none of them. Adding a kind adds a WORD below, never a switch.
GLYPHS=on

# --- THE VOCABULARY IT CHOOSES BETWEEN ----------------------------------------
#
# Not five more settings: the words `GLYPHS` selects, spelled here so that `off`
# is a supported value with a glyph of its own rather than a commented-out
# relic. CHANGING ONE IS A RENAME, and what it costs depends on who resolves
# the name. The lead's is the expensive one — `extension.toml.in`'s RENAMING
# header owns the sequence that applies it, which is not the same thing as
# installing it. The other three are cheaper — no manifest, no mailbox address
# — but none of them is free, because every session fleet spawns is looked up
# by the name it was given: both skills and `queue.py`'s fixer spawn
# `--on-existing adopt`, and `dispatch` spawns `--on-existing fail`. Change a
# word and a session running under the old one is no longer found, so the next
# spawn makes a second beside it. `thurbox-cli session rename` is what applies
# the new word to the one already running, and it is refused once something
# else holds the name, so it goes FIRST.
#
# `⌖` is U+2316 POSITION MARKER: East_Asian_Width Neutral, so one cell, and not
# an emoji, so it needs no colour font. It is what the lead wore for as long as
# it had a mark, and it is the reason `off` still leaves the lead marked while
# it leaves workers plain — the lead is a session you pick out of a list, and a
# worker is one of twenty.
LEAD_GLYPH_ON=📡
LEAD_GLYPH_OFF=⌖
WORKER_GLYPH_ON=🚀

# THE TWO SESSIONS A SKILL SPAWNS, which are not queue workers: the sweep
# `.agents/skills/diagnose-machine/` runs and the maintainer's pass
# `.agents/skills/review-prs/` runs. Both are long-lived and adopted rather
# than respawned, so each is a session you pick out of a list — which is the
# lead's reason for a mark, not a worker's, and why they are two words and not
# one shared `SKILL_GLYPH_ON`.
#
# `🩺` is U+1FA7A STETHOSCOPE and `🔍` is U+1F50D LEFT-POINTING MAGNIFYING
# GLASS: one code point each, Emoji_Presentation=Yes, East_Asian_Width WIDE,
# exactly like the two above.
#
# A SESSION ALREADY RUNNING under a plain name is not adopted by these: adopt
# matches the name, so the next spawn creates a second session rather than
# finding the first. Each skill's §1 says what to do about the one already on
# the machine, and it is a rename and not a delete.
DIAGNOSE_GLYPH_ON=🩺
REVIEW_GLYPH_ON=🔍
