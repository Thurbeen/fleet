# Whose conversation a task's outcome and questions belong to, and this is
# the tracked copy — which is why it names nobody.
#
# COPY IT TO `owners.conf` BESIDE THIS FILE TO ROUTE ANY. That copy is
# gitignored: which sessions own which kinds of work is yours, not this public
# repo's. `uv run fleet reconcile` reads it on every pass.
#
# --- WHAT IT CHANGES ----------------------------------------------------------
#
# Every task has an origin. `fleet queue add` run inside thurbox records the
# calling session as `thurbox:<session id>` unless `--origin` says otherwise,
# and gives that origin a reply command reaching the session's mailbox. Any
# other origin is your own opaque text, and this file says how it is reached.
#
# An origin is told two things: its task's outcome (shipped, then landed or
# abandoned) and its worker's `needs-input` question. Everything else the
# reconciler says — ready, stalled, unprompted, reviews, a sync — goes to the
# conductor, whatever the origin. A task whose origin starts with a prefix below
# that maps to a SESSION has those two delivered to the session whose name
# contains the substring, under the conductor's rules: only a session at rest,
# only into an input line provably empty, otherwise its thurbox mailbox with
# `--no-wake`, once each. A `thurbox:` origin no rule matches is that session.
# Any other origin no rule matches has no road: its question stays with the
# conductor, and its outcome is told to nobody.
#
# The session must be provably THIS machine's: exactly one local session whose
# name contains the substring, not a worker of this fleet's queue. Any other
# answer — none, several, or only a mirrored one from another host — delivers
# nothing and says why in the reconciler's log.
#
# A prefix that maps to a RELAY names a command instead: something that reaches
# an origin fleet cannot, such as an agent that serves many chat threads and
# forwards each message to the right one. It is run with no shell, with the
# origin and the message appended as its last two arguments.
#
# `queue.py`'s `origin_target` resolves an origin to one of those, to the
# session a `thurbox:` origin names, or to GONE once thurbox no longer lists
# that session. Any other origin is always reachable: a chat thread does not
# disappear.
#
# --- THE FORMAT ---------------------------------------------------------------
#
# One rule per line: an origin prefix on the left; on the right a session-name
# substring, or `!` and a relay command. Longest prefix wins, and a rule wins
# over a `thurbox:` origin's own session. Fleet parses neither side.
#
#     chat: = Assistant
#     chat:thread/ = !my-relay --conversation lead
