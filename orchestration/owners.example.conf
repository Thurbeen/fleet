# Whose conversation a task's notices belong to, and this is the tracked copy —
# which is why it names nobody.
#
# COPY IT TO `owners.conf` BESIDE THIS FILE TO ROUTE ANY. That copy is
# gitignored: which sessions own which kinds of work is yours, not this public
# repo's. `uv run fleet reconcile` reads it on every pass.
#
# --- WHAT IT CHANGES ----------------------------------------------------------
#
# The reconciler's ready / stalled / unprompted / needs-input notices go to this
# checkout's lead. A task added with `--origin <string>` whose origin starts
# with a prefix below has its notices delivered to the session whose name
# contains the substring instead, under the same rules: only a session at rest,
# only into an input line provably empty, otherwise its thurbox mailbox with
# `--no-wake`, once per transition. A task with no origin, or none matching,
# goes to the lead as it always did.
#
# The session must be provably THIS machine's: exactly one local session whose
# name contains the substring, not a worker of this fleet's queue. Any other
# answer — none, several, or only a mirrored one from another host — delivers
# nothing and says why in the reconciler's log.
#
# --- THE FORMAT ---------------------------------------------------------------
#
# One rule per line: an origin prefix on the left, a session-name substring on
# the right. Longest prefix wins. Fleet parses neither side.
#
#     chat: = Assistant
