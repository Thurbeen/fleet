# THE OTHER FLEETS the Kanban board may show beside this one — read, never
# written.
#
# Copy this file to `peers.conf` beside it (gitignored) to change anything.
# Editing THIS file would leave `fleet sync-checkout` a dirty tree to
# fast-forward, exactly as it would for the glyph and the agent.
#
# YOU PROBABLY NEED NO COPY. thurbox already lists every Mission Control on this
# machine and on each host in its hosts.toml, and `uv run fleet peers` reads
# that list: the lead's name says which fleet, its cwd which checkout, its
# backend which host. A fleet you can see in the session list is a peer without
# a line here. This checkout is never its own peer.
#
# THE TWO SETTINGS, both overrides of that list:
#
#   DISCOVER=off            stop asking thurbox; only the PEER lines below count
#   PEER=<host> <path> [<name>]
#                           one more fleet, repeatable. <host> is a name from
#                           thurbox's hosts.toml, or `local` for this machine;
#                           <path> is that fleet's checkout THERE; <name> is what
#                           the board calls it (default: the checkout's basename)
#
# A peer is asked one thing: to run its own read-only queue probe, over the
# same ssh path `fleet queue` uses for a remote task. `scripts/lib/peers.py`
# owns the rest — the timeout, the cache, and what `stale` and `unreachable`
# mean.
#
# THIS TRACKED COPY NAMES NO HOST, PATH OR FLEET, and `tests/pane/test_peers.py`
# fails one that does: a fresh clone of this public repo inherits nobody's
# machines.

DISCOVER=on
