# Fleet's OpenTelemetry export — and this is the tracked copy, which is why
# every line below is commented out: with no copy, fleet sends nothing.
#
# COPY IT TO `telemetry.conf` BESIDE THIS FILE TO TURN IT ON. That copy is
# gitignored: where YOUR collector listens, and the token it wants, are
# properties of your machine and not of this public repo.
#
# Read as DATA — `KEY=value`, no quoting, no continuation — and never executed.
# Read on every export, so an edit takes effect at the next one; whether the
# reconciler runs an export at all is asked again each time its clock is due.
# `scripts/lib/telemetry.py`'s docstring is what gets sent and why.
#
#     EXPORT=on            the switch; anything else, or no line, is off
#     ENDPOINT=http://localhost:4318
#                          the collector's OTLP/HTTP base; /v1/traces and
#                          /v1/metrics are appended. thurbox's default too,
#                          so one local collector takes both
#     PROTOCOL=http/json   http/json, or http/protobuf meaning the same port
#                          (fleet always sends JSON, which every OTLP/HTTP
#                          receiver accepts); grpc is refused
#     HEADERS=authorization=Bearer%20<token>
#                          comma-separated key=value, values percent-encoded,
#                          as OTEL_EXPORTER_OTLP_HEADERS spells them
#     TIMEOUT_MS=10000     the most one request may take; the first failure
#                          ends the export, and the rest goes next time
#     SERVICE_NAME=fleet   service.name on everything fleet sends; beats
#                          OTEL_SERVICE_NAME, as every key here beats its variable
#
# THE STANDARD VARIABLES fill in whatever this file leaves unsaid:
# OTEL_EXPORTER_OTLP_ENDPOINT, _PROTOCOL, _HEADERS and _TIMEOUT, and the
# per-signal OTEL_EXPORTER_OTLP_TRACES_* and _METRICS_* ENDPOINT, HEADERS and
# TIMEOUT, each used for its own signal only,
# OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES. Where both speak this file
# wins, because a variable in the environment may have been set for another
# program. OTEL_SDK_DISABLED=true turns the export off whatever this says.
#
# `uv run fleet telemetry export --dry-run` counts what the next export sends.
