# The reconciler's clocks, and what a finished task's session is left as —
# and this is the tracked copy, which is why every line below is commented out.
#
# COPY IT TO `reconcile.conf` BESIDE THIS FILE TO SET ANYTHING. That copy is
# gitignored: how often YOUR machine polls a forge, and whether you keep a
# worker's conversation after its work merged, are properties of you and not
# of this public repo. With no copy, fleet behaves exactly as it always has.
#
# Read as DATA — `KEY=value`, no quoting, no continuation — and this file is
# never executed. ONE SETTING BELOW holds a command line, which `reap` runs
# deliberately and nothing else reads; everything else here is a word or a
# number.
#
# --- THE CLOCKS ---------------------------------------------------------------
#
# Seconds, read by `uv run fleet reconcile` ONCE, WHEN THE LOOP STARTS. An edit
# takes effect at `uv run fleet reconcile restart`. FLEET_RECONCILE_<NAME>_SECS
# in the environment still overrides each one. A value that is not a whole
# number stops the loop from starting, and says which. Every default below is
# argued in `scripts/lib/reconcile.py`'s docstring, under THE CADENCES.
#
#     WATCH_SECS=20        seconds per `watch` call
#     COLLECT_SECS=120     seconds between collects
#     REFUEL_SECS=300      seconds between refuels
#     SHEPHERD_SECS=900    seconds between shepherds — each is a forge pass
#                          over every repository the queue names
#     SYNC_SECS=900        seconds between checkout syncs; 0 is off
#     BOUND_SECS=600       the most any child but `watch` may run before it is
#                          killed with what it started; `status` calls the loop
#                          STALLED past the longest child allowance plus
#                          tree termination and pipe draining (reconcile.py)
#     CONDUCTOR_SECS=300   the most one run of a one-shot conductor (`CONDUCTOR=on`
#                          in fleet.conf) may take; never more than BOUND_SECS
#                          less the state digest's minute and a margin. Read
#                          at every run, not at start (conductor_run.py)
#
# --- WHEN A CHANGE REQUEST MERGES OR CLOSES -----------------------------------
#
# `fleet queue reap` (which `collect` runs) moves a task to `landed` once every
# artifact merged, and to `abandoned` once its change request was closed
# unmerged. Either way blockers clear and the topic archives as always. These
# two say what happens to the task's session then. Read on every reap.
#
#     ON_LANDED=delete     delete the session and free its worktree's build
#                          output — the default
#     ON_LANDED=notify     keep the session, and type one line into it, once,
#                          when it is at rest, saying the work landed and the
#                          session is kept for follow-ups. It is then listed by
#                          `uv run fleet sessions orphans` for you to delete.
#     ON_CLOSED=delete     the same two words, for a change request closed
#     ON_CLOSED=notify     without merging
#
# A task abandoned by hand is always `delete`: nothing merged or closed.
# Any other word keeps the session untouched and says so on every reap.
#
# --- WHEN A WORKTREE IS NOBODY'S ANY MORE -------------------------------------
#
# `reap` frees a released worktree's build output — `target`, `node_modules`,
# `.venv` — and that is everything it can name for itself. A worker also starts
# things OUTSIDE its worktree that are keyed by it: a container stack, a
# database, a daemon, a tunnel, each belonging to a tool fleet has never heard
# of and must not name. Nothing took those down, and they outlive the directory
# they were raised in — measured on one machine, eleven leftover stacks keyed
# to worktrees that no longer existed, holding 26 GB of volumes on a disk that
# never shrinks.
#
# So this is the one place to put YOUR command for it. Unset — the tracked
# default — nothing runs and a reap behaves exactly as it always did.
#
#     WORKTREE_RELEASED_CMD=/home/you/bin/fleet-worktree-gone
#     WORKTREE_RELEASED_CMD_SECS=60
#
# THE CALL. Read as a command line and run with no shell, so a pipeline is not
# a command here — put one in a script and name the script. Two arguments are
# appended to whatever you wrote:
#
#     <your command> <absolute worktree path> <task ref>
#
# The path first, because that is how a tool outside fleet recorded what it
# made, and its last component is how such a tool usually names a project by
# default; the task's ref second, so a command can log or decide per task.
#
# WHAT TO EXPECT OF IT. It runs once per worktree, at each point reap lets one
# go: a vanished session's task retiring, a stale id being dropped, a session
# deleted with `--force`, and a fixer's checkout being taken back. In the
# `--force` case THE DIRECTORY IS ALREADY GONE when your command runs — reap
# reads the path before the deletion precisely so there is still one to hand
# over, and a tool keyed by the directory's name can still act without it.
# `reap --dry-run` prints the command it would run and runs nothing — except for
# a fixer's checkout, which it has to take back first: there it says it would
# hand it over, since a removal git refuses cancels the hand-over and a printed
# command would be a promise. A task that ran on another machine (`--host`)
# hands over nothing: its worktree is on that machine and your command is on
# this one.
#
# ON WINDOWS, NAME THE INTERPRETER. There is no shell here, and `CreateProcess`
# runs neither a `.cmd` nor a `.ps1` by itself:
#
#     WORKTREE_RELEASED_CMD=cmd /c C:\Users\you\bin\worktree-gone.cmd
#     WORKTREE_RELEASED_CMD=powershell -File C:\Users\you\bin\worktree-gone.ps1
#
# WHAT IT MAY NOT DO: hold up the reap. Its failure, its timeout and a line
# that cannot be read as a command are each printed, and the task lands all the
# same — the artifact merged whatever your machine thinks. It is held to
# WORKTREE_RELEASED_CMD_SECS — a whole number of seconds from 1 to 3600, 60 by
# default — and killed with everything it started past that, exactly as a
# reconciler child is. That bound is NOT one of the clocks above: it is read on
# every reap, by hand as much as by the loop, and no
# FLEET_RECONCILE_WORKTREE_RELEASED_CMD_SECS overrides it. It is also PER
# COMMAND, so a pass that releases ten worktrees can spend ten times it. The
# reconciler kills a whole `collect` that runs past BOUND_SECS (600) — and the
# worktrees that pass had not reached yet are NOT all simply waiting for the
# next one: a task whose session the pass already deleted has its receipt
# written and holds no session any more, so no later pass asks about its
# worktree again. A killed pass loses those hand-overs. If your teardown is
# slow, lower this and let the command background its own slow part.
#
# A worktree another session is sitting in is not handed over at all, and
# neither is one whose occupancy fleet could not establish. A fixer's checkout
# is handed over only by the one thing that takes it back, and only if
# `git worktree remove` went: a removal git refuses means files it does not
# track are in there, somebody is still working, and whatever they are running
# is theirs.
#
# WHAT NEVER REACHES IT. Only `reap` runs this, and only where reap itself
# lets a worktree go — so a worktree you remove yourself is not handed over.
# `ON_LANDED=notify` and `ON_CLOSED=notify` above are the case worth knowing:
# they keep the session, which keeps its worktree, so there is correctly
# nothing to take down at that moment — but the task's receipt is written then
# and the task stops being a session holder, so when you later delete that
# session yourself the worktree goes and no reap hands it over. The same has
# always been true of the build output under it. Whatever your command does,
# keep it runnable by hand for those: it is given a path and a ref and nothing
# it could not be given twice.
#
# Nothing in fleet deletes a volume, a container or an image. What your command
# does is yours, and a teardown that also removes data is one name collision
# away from removing somebody else's.
