# What the UNATTENDED LOOP does on its own — how often `fleet reconcile` runs
# each pass, and what `fleet queue shepherd` sends at a broken pull request.
# The tracked copy, and every value below is fleet's own default.
#
# COPY IT TO `reconcile.conf` BESIDE THIS FILE TO CHANGE ANYTHING. That copy is
# gitignored, the same way `auto-merge.conf` is: how hard this machine polls
# your forge, and whether a fix goes to the worker or to a new session, are
# properties of your fleet, not of this repo. Both readers fall back to THIS
# file when the copy is absent, and an operator who edited a tracked file
# instead would hand `fleet sync-checkout` a dirty tree, which it refuses to
# fast-forward.
#
# ONE FILE FOR BOTH because both are settings of the loop: the fixer is the one
# side effect the reconciler's shepherd pass has, and the interval is how often
# it has it. A hand-run `fleet queue shepherd` reads the same FIXER, so the two
# never fix a pull request two ways.
#
# Read as DATA — `KEY=value`, no quoting, no continuation — and never executed.
# Your copy REPLACES this file rather than adding to it: a key it leaves out is
# fleet's default, which is the value written here.

# --- WHAT A BROKEN PULL REQUEST GETS -------------------------------------------
#
# A pull request that is `conflicting`, `checks-failed`, `changes-requested` or
# `policy` gets a FIXER: a written brief (`fix-NN-<condition>.md` in the task's
# directory) and an agent told to read it. FIXER says which agent:
#
# `message`  the task's OWN worker session, which `reap` keeps alive while the
#            pull request is open for exactly this: it has the context and the
#            worktree. One line is typed into it — `Read <brief> and do what it
#            says.` — through `fleet queue send`'s path: its trust dialog
#            answered first, the send recorded under `sends`.
#              busy      a worker whose agent says `working` or `blocked` is
#                        never typed into; the pass leaves it alone and a later
#                        one sends once it is at rest. `running`, `uncovered`
#                        and `unreported` are observations, not the agent
#                        saying it is at rest, and wait the same way.
#              gone      a worker thurbox no longer lists, or one `reap`
#                        already deleted, FALLS BACK TO A NEW SESSION — the
#                        `session` below — and the shepherd row says so.
#              --host    a task on another machine is messaged like any other
#                        while its worker is there; once it is gone there is no
#                        fallback, because a fixer is never spawned on another
#                        host, and the row says that instead.
# `session`  always a NEW session on a checkout of the pull request's own
#            branch, and the worker is never typed into. A busy worker still
#            holds it: that checkout is the worktree the branch is already in,
#            which is the worker's, and two agents in one tree is how a fix
#            gets half-applied. A `--host` task gets no fixer at all.
#
# ONE FIXER PER PULL REQUEST, CONDITION AND HEAD COMMIT, in both modes. The one
# sent is recorded on the task under `shepherd`, so a pass every two minutes
# sends nothing while it works, or while it sits at rest with the same
# condition on the same head. Once it is at rest and the pull request is
# broken in a NEW way — another condition, or the same one on a head it pushed
# — the next pass sends again. `fleet queue shepherd --force` overrides.
#
# `message` is the default because it is what shepherd did before this was a
# setting. Any other value sends no fixer at all and says why on the row; the
# pull request is still classified and still merged.
FIXER=message

# --- HOW OFTEN THE LOOP RUNS EACH PASS -----------------------------------------
#
# Seconds. `fleet reconcile`'s docstring argues every default. The environment
# (`FLEET_RECONCILE_<NAME>_SECS`) WINS over this file, which wins over the
# default; the file is re-read every pass, so an edit needs no restart, and
# `uv run fleet reconcile status` prints what the running loop is using and
# where each value came from. A value that is not a whole number of seconds is
# ignored for the default, and `status` says so.
#
# SHEPHERD is the one worth changing: 120 answers a broken pull request within
# two minutes, at one pull-request list per repository per pass. Every pass is
# idempotent (above), so a shorter clock costs forge calls and nothing else.
WATCH_SECS=20
COLLECT_SECS=120
REFUEL_SECS=300
SHEPHERD_SECS=900
# 0 turns the checkout sync off.
SYNC_SECS=900
