# Which repositories reach their base branch through an INTEGRATION BRANCH, and
# this is the tracked copy — which is why it names none.
#
# COPY IT TO `flow.conf` BESIDE THIS FILE TO NAME ANY. That copy is gitignored
# for the reason `auto-merge.conf` is: how YOUR repositories merge is a
# property of you, not of this public repo. `uv run fleet queue collect` reads
# it on every pass, so an edit takes effect on the next one.
#
# --- WHAT IT CHANGES ----------------------------------------------------------
#
# `collect` proves a `pr` or `attested` task by a change request FROM THE
# TASK'S BRANCH. In a repository listed here, a change request from the named
# integration branch (`develop` → `main`) proves it too — when the commits the
# forge lists for it include the head of the task's branch, read from the
# task's own checkout. A develop→main that does not carry that commit is
# refused like any pasted change request. The task's own feat→develop change
# request still verifies as it always did.
#
# This replaces the BRANCH check only. An `attested` task still needs the
# develop→main change request's own attestation for its head, or its merge.
#
# --- THE FORMAT ---------------------------------------------------------------
#
# One rule per line, HOST-QUALIFIED on the left, the integration branch on the
# right. Longest prefix wins, case-insensitively; a line that names no forge is
# refused with a line on stderr.
#
#     github.com/some-owner/some-repo = develop
#     gitlab.example.com/group = develop
#
# `uv run fleet check automerge` fails this file if anything is ever enabled.
