# The agents allowed to serve WHICH repositories, and this is the tracked copy
# — which is why it names none.
#
# COPY IT TO `agent-policy.conf` BESIDE THIS FILE TO NAME ANY. That copy is
# gitignored, the same way `auto-merge.conf`, `voice.conf` and
# `session-glyphs.conf` are, and for the same reason stated harder: WHICH
# AGENTS MAY WORK ON WHICH REPOSITORIES IS A PROPERTY OF YOU, NOT OF THIS
# REPO. This one is public and agnostic — it is machinery anybody can run — so
# an operator who clones it must never inherit another operator's policy, and
# an operator who adds their own must never push them back. `uv run fleet queue
# add` and `uv run fleet queue dispatch` read THIS file when the copy is absent,
# so a fresh clone enforces NO policy until somebody says otherwise, and that
# silence is the correct default rather than an omission.
#
# NO RE-INSTALL AND NO RESTART. Nothing renders this: `add` and `dispatch`
# read it on every call, so an edit here takes effect on the next one.
#
# --- THE FORMAT ---------------------------------------------------------------
#
# One rule per line, HOST-QUALIFIED on the left — `github.com/owner/repo`,
# `gitlab.example.com/group/sub/project` — and an ordered comma-separated list
# of agents on the right. The first agent is the DEFAULT for repositories the
# prefix matches; the rest are allowed only when named explicitly with
# `--agent`. A list of one makes that agent the only possible choice.
#
#     github.com/some-owner = some-agent
#     github.com/other-owner = some-agent, another-agent
#
# Blank lines and everything after a `#` are ignored, the same as
# `registry/owners.txt`.
#
# An entry that names no forge is REFUSED with a line on stderr rather than
# matched against a bare `owner/repo`: `Thurbeen/fleet` is a different
# repository on github.com and on a self-hosted instance, and this is the one
# list where matching the wrong one means acting on somebody else's code.
#
# An entry with no agents on the right is also refused: an empty allowlist
# would forbid every agent, which is almost never what a hand-edited line
# means.
#
# Matching is case-insensitive and longest-prefix-wins: a rule for
# `github.com/owner/repo` beats a rule for `github.com/owner`.
#
# `FLEET_AGENT_POLICY` in the environment REPLACES what is here rather than
# adding to it — a fleet driving somebody else's repositories is a different
# fleet, not this one plus an extra.
#
# --- WHAT PUTTING A REPOSITORY HERE MEANS -------------------------------------
#
# The first agent in the list becomes the default for every matching
# repository. An explicit `--agent` is accepted only when it is in the list. A
# task whose checkout is on another machine (`--host`), or whose repository
# cannot be determined from its local `origin`, is refused when any policy is
# in force: the rule cannot be checked, so fleet fails closed.
#
# A session profile carrying `command` is refused for a covered repository for
# the same reason: a free command can launch any agent, and fleet cannot tell
# which one.
#
# --- YOUR REPOSITORIES --------------------------------------------------------
#
# Uncomment and edit in your own copy. Nothing is enabled here, and
# `uv run fleet check automerge` fails this file if anything ever is.

# github.com/some-owner = some-agent
# github.com/other-owner = some-agent, another-agent
