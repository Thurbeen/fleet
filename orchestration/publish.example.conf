# How a task PUBLISHES, and what fleet goes and looks for afterwards — the
# tracked copy, which names no tool.
#
# COPY IT TO `publish.conf` BESIDE THIS FILE TO CHANGE ANYTHING. That copy is
# gitignored, the same way `auto-merge.conf` and `registry/owners.txt` are:
# which publishing tool you run is a property of you, not of this repo. The
# reader falls back to THIS file, so the defaults below need no copy at all.
#
# WHAT FLEET KNOWS AND WHAT IT DOES NOT. `scripts/lib/queue.py` models six
# ARTIFACT SHAPES — what a finished task must leave behind — and nothing else:
#
#   pr        a pull request from this task's branch, by any means at all
#   attested  that, plus a body carrying an ATTESTATION for the commit that
#             would merge — so a verdict from an earlier push cannot authorise
#             the push that replaced it
#   push      a commit that is an ancestor of origin/<base>: its URL, or its
#             full sha when `origin` is on no forge. Git alone proves it
#   note      a review or comment on the change request or issue the task
#             names with `add --target`, written by the account fleet runs as
#   served    a document served to a READER, who is expected to answer it.
#             Checked no more than `none` is — fleet cannot ask a server it
#             did not start whether a reader is finished — but the task WAITS,
#             holding the session that can answer them, until a person runs
#             `fleet queue reviewed <ref>`
#   none      nothing fleet can check and nobody waiting — an issue filed, a
#             machine swept, a commit in a repository with no remote.
#             Recorded, and never called verified
#
# WHICH ONE A DOCUMENT IS: a design, spec or proposal somebody reviews is
# `pr`, committed on the branch and reviewed in the pull request; `served` only
# where no forge holds the review; `note` for a review on an existing PR or
# issue; `none` only when nobody reads or answers the result. `add` warns when a
# `none` task asks for a document, and `collect` holds a `none` result that
# names one for its reader, until `fleet queue reviewed`.
#
# THE FIFTH AND THE SIXTH DIFFER BY ONE FACT, and it is worth the word. `none`
# closed five tasks whose deliverable was a served document the moment it was
# served: nothing was left to wait on, so the session was reaped, and every
# reader who annotated one of those documents and sent it back was answered by
# "No agent is listening right now". The document existed; the REVIEW had not
# started. Keeping every `none` session instead would leak one per issue filed
# and one per machine swept, so the distinction is the fix and not the keep.
#
# A LOCAL-ONLY FLEET — no forge CLI and no forge login anywhere — is an
# ordinary setup. `push` against a bare or local `origin` and `none` need
# nothing but git. `pr`, `attested` and `note` need a forge to prove them, so
# without one `collect` closes them as unchecked and says so; set METHOD to
# `push` or `none` below if you have no forge.
#
# A task that works on a change request it did not open — a contributor's pull
# request — records it with `add --target` too, and a `pr` or `attested` task
# is then checked against that change request instead of its own branch.
#
# A shape is not a tool. Your pipeline, an in-house script, `make release`, a
# slash command — all of them end in one of those shapes, which is how fleet
# stays agnostic about a tool it has never heard of. The tool rides on the
# record as `publish.how`: free text, rendered into the brief, NEVER parsed.
#
# A fourth word here was one operator's TOOL NAME rather than a shape, and the
# code branched on it. It is retired: `no-mistakes` is still accepted wherever
# a method is read, so a record written before the rename still loads, and it
# means `attested`. Nothing writes it, and new records say `attested`.

# --- THE DEFAULT EVERY TASK TAKES ---------------------------------------------
#
# `fleet queue add` uses these unless `--publish` / `--how` says otherwise. An
# explicit `--publish` that matches METHOD keeps HOW; a different method drops
# HOW unless `--how` names its command. An explicit `--how` always wins. That
# lets a lead name the required artifact shape without losing the command that
# produces it, while a task with another shape never inherits the wrong tool.
#
# `METHOD` is one of the words above. `HOW` is free text: the sentence
# the brief hands the worker, naming your tool in your words.
#
# New tasks default to `pr`: a pull request from the task's branch is the
# artifact. `collect` checks that artifact; `shepherd` separately checks CI,
# reviews and mergeability. `attested` remains available for existing records
# and explicit tasks, and still requires the marker below. A live operator
# `publish.conf` overrides this tracked example; switch its METHOD to `pr`
# separately when moving new tasks to clean PR bodies. With no forge, use
# `push` or `none`.
METHOD=pr
HOW=

# --- WHERE A `served` DOCUMENT IS HOSTED --------------------------------------
#
# Free text, like HOW, and handed to every `served` task that names no `--how`
# of its own and, under `METHOD=served`, gets no HOW: the command or
# instructions a worker uses to put its page in
# front of the reader, and keep it there while it answers them. Fleet runs no
# server; the worker hosts, and its URL goes in result.md's `artifact:`.
#
# A page served from a machine dies with that machine, so name something the
# READER can reach from theirs — a review server published on your private
# network, a share link — and not a port on a laptop that will sleep. Empty
# leaves the choice to the worker, and names no tool.
SERVE=

# --- WHAT AN ATTESTATION LOOKS LIKE -------------------------------------------
#
# Only read when a task's method is `attested`. Fleet looks for an HTML comment
# named by `ATTESTATION_MARKER` in the change request body, in either of TWO
# SHAPES — the marker alone, with the JSON in a fenced block underneath:
#
#     <!-- MARKER -->
#     ```json
#     { "head_sha": "<40 hex>", "steps": [ ... ], "verdict": "passed" }
#     ```
#
# or the JSON inside the comment, which is what a pipeline emitting `MARKER:v1`
# writes:
#
#     <!-- MARKER:v1 {"head_sha": "<40 hex>", "steps": [ ... ]} -->
#
# In both, `head_sha` must equal the change request's CURRENT head and `steps`
# must be a non-empty list. An HTML comment rather than prose because the
# headings a pipeline prints are text anyone can paste, and a check that
# counted them would let a body authorise its own merge.
#
# THE TWO SHAPES SPELL `skipped` DIFFERENTLY, so each block is read under the
# vocabulary it declares and never under a union of the two. A block carrying
# `verdict` is read by the first: statuses are `passed`, `failed`, `skipped`
# and `not-applicable`, a skipped step blocks, and the verdict must be
# `passed`. A block without one is read by the second: statuses are
# `completed`, `skipped`, `running` and `pending`, everything but the trailing
# `pr` and `ci` steps must be done, and a skip is a step that had nothing to do.
#
# The default names a FORMAT and not a tool: any publisher may emit it, and a
# publisher that emits something else is what this setting is for. Fleet reads
# your marker rather than asking you to emit fleet's.
ATTESTATION_MARKER=publish-attestation/v1

# The subject prefix of commits YOUR PIPELINE makes on its own, if it makes
# any. Purely to improve one message: a pipeline that writes the attestation
# and then pushes CI fixes on top leaves a body attesting an ancestor of the
# head. Refusing that is right either way, but "somebody pushed over the
# pipeline" and "the pipeline did this to itself" have different remedies, and
# only the second is answered by running the tool again.
#
# Matched case-insensitively at the start of a commit subject, after an
# optional `chore: `. Empty means fleet never claims to know, which is the
# honest answer when it does not.
PIPELINE_COMMIT_PREFIX=

# --- OPTIONAL INDEPENDENT REVIEW ---------------------------------------------
#
# Empty REVIEW_REPOS keeps the existing artifact and attestation contracts.
# Opt in with comma-separated HOST/OWNER/REPO identities in publish.conf.
# REVIEWER_TASK is one dedicated queue task (topic/NN-slug), already attached
# to an independent live reviewer session; REVIEW_SCORE is its maximum score.
# The operator chooses the review tool and publishing workflow in that task's
# brief. Fleet never starts a reviewer or interprets English score summaries.
#
# Every open PR in those repositories is watched, including unqueued PRs.
# Publishing is still `shipped`, CI readiness is still separate, and only the
# assigned reviewer can record its linked, current-full-head assessment:
#
#   uv run --project <control-plane-checkout> fleet queue review record <PR-URL> --head <40-hex-head> \
#     --score <score> --findings <open-count> --evidence <forge-summary-note-URL>
#
# The note must exist in readable forge feedback and name the full head. The
# recorded score and finding count are the reviewer's attestation, not text
# inferred from an author's body or result. Maximum score and zero findings
# require passing checks, mergeability and zero unresolved threads too.
# A new head, changed feedback or changed assignment requires reassessment.
# Deliberately stopping the session preserves a completed clean assessment,
# but prevents new recordings and wakes. Retiring or blocking its task, or a
# missing/unreadable session census, invalidates the assessment.
#
# Pending review wakes the assigned reviewer only at rest with an empty input
# line. Findings reach the existing worker/fixer by the same safe route. Busy
# sessions receive a no-wake mailbox note. Missing recipients and unfinished
# assessments stay visible in `queue plan`, which notifies the lead. No hidden
# spawn or second merger: clean review supplements shepherd's existing gates,
# allowlist, opener permission and human holds. `attested` tasks still need
# their original publisher attestation. A plain `pr` may use this independent
# assessment as its vetting evidence only in the explicitly opted-in repos.
#
# The configured reviewer is kept even after its result was collected, and
# remains eligible for the existing fuel-gated refuel. Remove the assignment
# before retiring its session. Runtime records live under shepherd/reviews;
# scripts/lib/review_lifecycle.py owns their lifecycle and trust boundary.
REVIEW_REPOS=
REVIEWER_TASK=
REVIEW_SCORE=
