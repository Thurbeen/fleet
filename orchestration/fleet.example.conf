# THIS FLEET'S NAME — the one setting that lets a machine run more than one.
#
# Copy this file to `fleet.conf` beside it (gitignored) and fill in NAME, then
# `uv run fleet install-extension`. Editing THIS file would leave
# `fleet sync-checkout` a dirty tree to fast-forward, exactly as it would for
# the glyph and the agent.
#
# WHAT IT DECIDES, and it is two names and nothing else:
#
#   the extension   `fleet` unnamed, `fleet-<name>` named. It is the id every
#                   `thurbox-cli extension ...` command takes and the directory
#                   it derives under thurbox's config.
#   the lead        `<glyph> Mission Control` unnamed,
#                   `<glyph> Mission Control · <name>` named. It is what the
#                   session list shows and what the mailbox addresses.
#
# It decides NOTHING ELSE, because nothing else was ever global. The queue, the
# registry, the run logs, the reconciler's runtime and the first-run answers all
# live in the checkout already; two clones were always two of each. The two
# NAMES above were the singleton, and thurbox resolves both by name: a second
# clone rendering `fleet` registered over the first extension and was handed the
# first's session, which is the "still opens a different directory" refusal.
#
# UNSET IS A REAL ANSWER and the tracked default. An unnamed fleet renders the
# two names it always did, so a machine with one fleet never meets this setting
# and nothing it runs is renamed. Name a fleet only when a SECOND one exists —
# and then name the second, not the first, unless you are willing to pay for the
# first's rename.
#
# NAMING A FLEET THAT IS ALREADY RUNNING IS A RENAME, with everything
# extension.toml.in's RENAMING header says about one: thurbox names a session
# when it SPAWNS it and has no rename verb, so installing a new name spawns a
# SECOND session and orphans the first. That header holds both sequences — the
# fork that keeps the lead's conversation, and the deactivate that discards it.
#
# THE GRAMMAR IS BARE, and narrowly so: the name becomes a directory under
# thurbox's config and a path segment inside a session name, on two operating
# systems. Letters, digits, `_` and `-`, starting with a letter or a digit, at
# most 24 of them. Anything else is refused before a file is written — and a
# DOUBLE underscore with it, since `__x__` is how this repo spells an unrendered
# placeholder and `scripts/lib/notify_lead.py` reads a lead whose name carries
# one as a manifest nobody rendered, then stops waking it.
#
# ONE FLEET PER CHECKOUT, ALWAYS — this does not divide one checkout into two.
# `fleet queue` still refuses to create records outside the checkout its own
# manifest names, and that guard is what keeps two fleets from writing one
# queue. To run a second fleet, clone the repo again:
#
#     sh install.sh --dir ~/fleet-acme --name acme
#
# WORKER sessions carry no fleet name, deliberately. Nothing resolves a worker's
# name — it is an imperative sentence about its work, spawned and reaped by the
# queue that owns it — so a name would be decoration that every dispatch has to
# keep in step. Which fleet a worker belongs to is a question its task record
# answers.
#
# The one place two fleets meet is a TITLE they both used: thurbox's session
# names are one namespace per machine, and `dispatch` spawns with
# `--on-existing fail` because a twin breaks by-name addressing for both of
# them. So the second dispatch fails, loudly, naming the session in the way, and
# the fix is to retitle the task. That is the same refusal one fleet gets for
# dispatching one title twice, and it is preferred to a silent twin.

NAME=
