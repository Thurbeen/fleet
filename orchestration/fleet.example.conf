# THIS FLEET'S NAME — the one setting that lets a machine run more than one —
# SHARE, what this fleet tells its peers, and CONDUCTOR, whether it runs a
# background session of its own to keep the work moving (both at the end).
#
# Copy this file to `fleet.conf` beside it (gitignored) and fill in NAME, then
# `uv run fleet install-extension`. Editing THIS file would leave
# `fleet sync-checkout` a dirty tree to fast-forward, exactly as it would for
# the glyph and the agent.
#
# WHAT NAME DECIDES, and it is two names and nothing else:
#
#   the extension   `fleet` unnamed, `fleet-<name>` named. It is the id every
#                   `thurbox-cli extension ...` command takes and the directory
#                   it derives under thurbox's config.
#   the lead        `<glyph> Mission Control` unnamed,
#                   `<glyph> Mission Control · <name>` named. It is what the
#                   session list shows and what the mailbox addresses.
#
# It decides NOTHING ELSE, because nothing else was ever global. The queue, the
# registry, the run logs, the reconciler's runtime and the first-run answers all
# live in the checkout already; two clones were always two of each. The two
# NAMES above were the singleton, and thurbox resolves both by name: a second
# clone rendering `fleet` registered over the first extension and was handed the
# first's session, which is the "still opens a different directory" refusal.
#
# UNSET IS A REAL ANSWER and the tracked default. An unnamed fleet renders the
# two names it always did, so a machine with one fleet never meets this setting
# and nothing it runs is renamed. Name a fleet only when a SECOND one exists —
# and then name the second, not the first, unless you are willing to pay for the
# first's rename.
#
# NAMING A FLEET THAT IS ALREADY RUNNING IS A RENAME, with everything
# extension.toml.in's RENAMING header says about one: thurbox names a session
# when it SPAWNS it and has no rename verb, so installing a new name spawns a
# SECOND session and orphans the first. That header holds both sequences — the
# fork that keeps the lead's conversation, and the deactivate that discards it.
#
# THE GRAMMAR IS BARE, and narrowly so: the name becomes a directory under
# thurbox's config and a path segment inside a session name, on two operating
# systems. Letters, digits, `_` and `-`, starting with a letter or a digit, at
# most 24 of them. Anything else is refused before a file is written — and a
# DOUBLE underscore with it, since `__x__` is how this repo spells an unrendered
# placeholder and `scripts/lib/notify_conductor.py` reads a lead whose name carries
# one as a manifest nobody rendered, then stops waking it.
#
# ONE FLEET PER CHECKOUT, ALWAYS — this does not divide one checkout into two.
# `fleet queue` still refuses to create records outside the checkout its own
# manifest names, and that guard is what keeps two fleets from writing one
# queue. To run a second fleet, clone the repo again:
#
#     sh install.sh --dir ~/fleet-acme --name acme
#
# WORKER sessions carry no fleet name, deliberately. Nothing resolves a worker's
# name — it is an imperative sentence about its work, spawned and reaped by the
# queue that owns it — so a name would be decoration that every dispatch has to
# keep in step. Which fleet a worker belongs to is a question its task record
# answers.
#
# The one place two fleets meet is a TITLE they both used: thurbox's session
# names are one namespace per machine, and `dispatch` spawns with
# `--on-existing fail` because a twin breaks by-name addressing for both of
# them. So the second dispatch fails, loudly, naming the session in the way, and
# the fix is to retitle the task. That is the same refusal one fleet gets for
# dispatching one title twice, and it is preferred to a silent twin.

NAME=

# WHAT THIS FLEET SHARES WITH ITS PEERS. Another fleet's
# `uv run fleet context repo <repo> --peers` asks this one, over ssh or on this
# machine, what it knows about one repository; this setting is the whole answer
# to what it may be told. `scripts/lib/context.py` reads it — the one reader of
# this key, as `install-extension` is of NAME — every time it is asked.
#
#   (unset or empty)   facts: this fleet's live facts about that repository
#   facts,results      also the first line of each result on it
#   none               nothing; every read is refused, and says so
#
# NOTHING ELSE HAS A WORD, so no value serves it: prompts, briefs, OPERATOR.md,
# run logs, transcripts and `registry/context` narrative never leave this
# fleet. A word fleet does not know is dropped, never guessed at. Each fleet
# stays the only writer of its own facts; a peer reads, and keeps a fact only by
# recording it in its own store with `--source peer:<fleet>/<id>`.

SHARE=

# WHETHER THIS FLEET RUNS A CONDUCTOR — the actor, beside the lead, that keeps
# the work moving — and HOW. Read by `uv run fleet install-extension`, which
# renders what each answer needs, and by the reconciler's notifier
# (`scripts/lib/conductor_run.py`), which runs the one-shot.
#
#   (unset, or off)   no conductor. The lead is both the only origin and the
#                     conductor, and every notice reaches it as it always did.
#   on                ONE RUN PER NOTICE. Each ready, stalled, unprompted,
#                     needs-input, review and sync notice runs the conductor's
#                     agent once, headless, in `orchestration/conductor/`,
#                     handed the notice, the fleet's state read then, its
#                     journal, and CONDUCTOR.md read from the checkout then. No
#                     session: the manifest is the one unset renders. A run
#                     that fails hands the notice to the lead instead.
#   session           the manifest also declares `<glyph> Conductor` (with
#                     ` · <name>` when NAME is set), a session opening that
#                     directory. The notices are typed into it while it runs,
#                     and go to the lead whenever it does not.
#
# UNSET IS A REAL ANSWER and the tracked default, by the rule NAME follows: a
# fleet that never turns this on renders byte-for-byte the manifest it rendered
# before the conductor existed, so nothing it runs is renamed or respawned.
# `on` renders that same manifest.
#
# THE CONDUCTOR'S AGENT is `CONDUCTOR_AGENT` in `agent.conf`, else `AGENT`,
# else `claude`. How it runs headless is `conductor_run.py`'s, per agent:
# claude under its auto permission mode, codex under `exec --approve-for-me`,
# and `<agent>.HEADLESS=` in `agent.conf` for any other, or to override either.
# A run is bounded by `CONDUCTOR_SECS` in `reconcile.conf`.
#
# `session` SPAWNS ONE SESSION AND RENAMES NONE: the lead keeps its name and
# its conversation. Its mark is `CONDUCTOR_GLYPH_ON` in `session-glyphs.conf`.
# LEAVING `session` deletes nothing by itself — thurbox keeps a session the
# manifest stopped declaring — so `extension.toml.in`'s conductor block holds
# the order: install first, then delete the session. `install-extension` names
# a conductor session still running once the conductor is `on`.
#
# Its role is `.agents/skills/fleet-conductor/` and its standing context
# `CONDUCTOR.md`; what any origin does to hand fleet work is
# `.agents/skills/fleet-intake/`.

CONDUCTOR=
