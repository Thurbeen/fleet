# Automatic analysis reads this file, not sonar-project.properties.
# Explicit roots keep operator state, generated files and dependencies out.
sonar.sources=fleet,scripts,interface,install.sh,install.ps1,.github,.pre-commit-config.yaml,.publish.yaml,renovate.json,orchestration/session-profiles.yaml
sonar.tests=tests
sonar.sourceEncoding=UTF-8
# pyproject.toml requires >=3.11; these are Sonar's supported versions above it.
sonar.python.version=3.11,3.12,3.13,3.14
