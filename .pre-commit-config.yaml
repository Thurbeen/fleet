# Pre-commit hooks. Run with `prek` (https://github.com/j178/prek), not the
# Python `pre-commit`:
#
#     prek install
#
# Every hook runs `uv run fleet check <name>`, which is also what CI runs and
# what .publish.yaml declares as the gate — so a hook cannot drift from the gate
# it stands in for. One hook per static check rather than a single whole-gate
# hook, so a commit touching only prose does not wait on the test suite. The
# commands carry no shell syntax, so they run the same from bash, cmd and
# PowerShell.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: lock
        name: uv.lock matches pyproject.toml
        entry: uv run --frozen fleet check lock
        language: system
        files: '^(pyproject\.toml|uv\.lock|tests/stubs/pyproject\.toml)$'
        pass_filenames: false

      - id: lint
        name: ruff
        entry: uv run --frozen fleet check lint
        language: system
        files: '\.py$'
        pass_filenames: false

      - id: markdown
        name: markdown (rumdl)
        entry: uv run --frozen fleet check markdown
        language: system
        files: '\.md$'
        pass_filenames: false

      - id: docs
        name: README links and diagram
        entry: ./scripts/check.sh docs
        language: system
        files: '^(README\.md|docs/.*|scripts/lib/check_docs\.py)$'
        pass_filenames: false

      - id: yaml
        name: YAML parses
        entry: uv run --frozen fleet check yaml
        language: system
        files: '\.ya?ml$'
        pass_filenames: false

      # A job All Checks does not need can fail while the pull request reports
      # green, and a commit straight to main never meets CI to find out.
      - id: workflow
        name: CI workflow gates every job
        entry: uv run --frozen fleet check workflow
        language: system
        files: '^(\.github/workflows/ci\.yml|scripts/lib/check_workflow\.py)$'
        pass_filenames: false

      - id: profiles
        name: session profiles render
        entry: uv run --frozen fleet check profiles
        language: system
        files: '^(orchestration/session-profiles\.yaml|scripts/lib/session_profiles\.py)$'
        pass_filenames: false

      # Unfiltered: a skill hand-added under .claude/ instead of .agents/skills
      # shows up in a commit that touches no skill at all.
      - id: skills
        name: agent skills layout
        entry: uv run --frozen fleet check skills
        language: system
        always_run: true
        pass_filenames: false
