# The same Rust-native gate as CI and publish. Install with: prek install
# Test suites and warning-denied documentation run in the full publish gate.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: markdown
        name: Markdown
        entry: cargo xtask check markdown docs
        language: system
        files: '\.md$'
        pass_filenames: false
      - id: workflow
        name: YAML and workflow contracts
        entry: cargo xtask check yaml workflow
        language: system
        files: '\.ya?ml$'
        pass_filenames: false
      - id: rust-fmt
        name: Rust formatting
        entry: cargo xtask check rust-fmt
        language: system
        files: '\.rs$'
        pass_filenames: false
      - id: rust-lint
        name: Clippy with warnings denied
        entry: cargo xtask check rust-lint
        language: system
        files: '(\.rs|Cargo\.(toml|lock)|rust-toolchain\.toml)$'
        pass_filenames: false
      - id: rust-deny
        name: Dependency policy
        entry: cargo xtask check rust-deny
        language: system
        files: '(Cargo\.(toml|lock)|deny\.toml)$'
        pass_filenames: false
