[project]
name = "fleet"
version = "0.0.0"
description = "A control plane that orchestrates and maps projects through thurbox."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.3"]

# Gate tools, pinned here so every runner installs the same ones. `uv run`
# syncs this group by default, so `uv run fleet check` finds rumdl on PATH.
[dependency-groups]
dev = ["pytest==9.1.1", "rumdl==0.2.73", "ruff==0.16.7"]

[project.scripts]
fleet = "fleet.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

# The package sits at the top of the checkout, beside the scripts/lib/ modules
# it dispatches to, rather than under src/.
[tool.uv.build-backend]
module-root = ""

# The gate's lint, pinned here so a user-level ruff config on the machine
# running it decides nothing: the rules that catch a broken program, and no
# style rule to re-litigate.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# No .pytest_cache in the tree: a checkout the gate leaves dirty is one
# `fleet sync-checkout` refuses to fast-forward.
[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
# The suite builds whole checkouts, stub venvs and queues under tmp_path, and
# pytest keeps the last three sessions' directories by default. Keep only a
# failed test's, from the last session: that is the evidence worth reading.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
