# cargo-deny's rules for the Rust workspace, run by `cargo xtask check rust-deny`
# as `cargo deny --locked check`: advisories, bans, licenses and sources.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Every RustSec advisory against a crate in Cargo.lock fails the check: a
# vulnerability, an unmaintained crate, a yanked version. An exception goes in
# `ignore` with the advisory id and the reason, where review can see it.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Only these. A crate under anything else fails until it is reviewed and added
# here with the crate that needs it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # unicode-ident, through proc-macro2 and syn.
    "Unicode-3.0",
]
confidence-threshold = 0.9

# The workspace's own crates are `publish = false` and covered by LICENSE at
# the root; the rule is for what Cargo.lock pulls in.
[licenses.private]
ignore = true

[bans]
# Two versions of one crate are worth knowing about, not worth failing on:
# often the fix belongs to a dependency upstream.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies carry no version, which is fine
# because no member is published.
allow-wildcard-paths = true

[sources]
# crates.io only. A git dependency or another registry is a supply-chain
# decision, made here in review rather than by a line in a Cargo.toml.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
