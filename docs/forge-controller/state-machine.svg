<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
<title id="title">Forge controller state machine</title>
<desc id="desc">Each change a worker declares on a Task moves from Declared, where its ChangeRequest is created, to Mirrored, where relay and the draft flip happen on every pass, to Settled when the ChangeRequest settles. Deleting the Task deletes its ChangeRequests and the forge finalizer holds the record until they are gone. The Task's own phases belong to the Task controller.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#405367"/></marker></defs>
<rect width="1040" height="480" rx="12" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="#182b3d">
<text x="24" y="35" font-size="21" font-weight="700">One declared change, under status.forge.changes</text>
<text x="24" y="60" font-size="14">The Task's phases are the Task controller's; this controller tracks each change the worker declares.</text>
<g stroke="#7890a6" stroke-width="1.5" fill="#edf3f8">
<rect id="task" x="25" y="150" width="190" height="68" rx="8" fill="#f5f7fa" stroke-dasharray="5 4"/>
<rect id="declared" x="295" y="150" width="190" height="68" rx="8"/>
<rect id="mirrored" x="565" y="150" width="190" height="68" rx="8"/>
<rect id="settled" x="835" y="150" width="180" height="68" rx="8" fill="#e9f5ef"/>
<rect id="removed" x="565" y="330" width="190" height="68" rx="8" fill="#f0edfa"/>
</g>
<g text-anchor="middle" font-size="17" font-weight="650">
<text x="120" y="177">Task</text><text x="390" y="177">Declared</text><text x="660" y="177">Mirrored</text>
<text x="925" y="177">Settled</text><text x="660" y="357">Removed</text>
</g>
<g text-anchor="middle" font-size="12">
<text x="120" y="199">any Task, any phase</text><text x="390" y="199">ChangeRequest being created</text><text x="660" y="199">relay · flip, every pass</text>
<text x="925" y="199">merged, closed or gone</text><text x="660" y="379">ChangeRequests gone</text>
</g>
<g fill="none" stroke="#405367" stroke-width="1.8" marker-end="url(#arrow)">
<path id="declare" d="M215 184 H293"/>
<path id="created" d="M485 184 H563"/>
<path id="settle" d="M755 184 H833"/>
<path id="delete" d="M660 218 V328"/>
</g>
<g font-size="12" fill="#405367" text-anchor="middle">
<text x="254" y="170">fleet declare</text>
<text x="524" y="170">created</text>
<text x="794" y="170">settled</text>
<text x="800" y="262">Task deleted, from ANY phase:</text>
<text x="800" y="280">delete its ChangeRequests,</text>
<text x="800" y="298">fleet.dev/changes holds until gone</text>
</g>
<g font-size="12" fill="#405367">
<text x="300" y="100">A Task may declare several changes; each entry has its own cursor and flip record.</text>
<text x="300" y="118">A Task that declares nothing has an empty status.forge and costs nothing here.</text>
</g>
<path d="M25 418 H1015" stroke="#c9d3dd"/>
<g font-size="14">
<text x="25" y="446" font-weight="650">Nothing merges, nothing is revived</text>
<text x="25" y="468">Mergeable is reported on the ChangeRequest. A relay gap, a failed flip or a gone ChangeRequest raises NeedsAttention under status.forge.</text>
</g>
</g>
</svg>
