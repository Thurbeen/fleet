  <text class="t green-t" x="376.5" y="222">Queue</text>
  <text class="s" x="376.5" y="242">PROMPT.md → topic → tasks</text>
  <text class="s" x="376.5" y="258">task.yaml · BRIEF.md · result.md</text>
  <text class="s" x="376.5" y="274">blockers · artifact per repo</text>

