<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 824" width="960" height="824" role="img" aria-labelledby="title desc">
  <title id="title">How fleet fits together</title>
  <desc id="desc">The operator gives Mission Control, the lead agent session in thurbox, a prompt and watches the queue pane. The lead drives the queue with queue.sh: a topic holds tasks, each with task.yaml, BRIEF.md, progress.jsonl and result.md. Dispatch starts one worker session per task in its own git worktree, locally or on a remote host; each worker writes result.md and publishes a change request through the forge seam, GitHub via gh or GitLab via glab. The reconciler runs watch, collect, shepherd, refuel and plan through queue.sh, asks the forge about change requests, wakes the lead when work is ready, and never dispatches. The registry and the operator's settings feed the lead and the queue. Along the bottom, the loop: intake, brief, dispatch, watch, collect, shepherd, merge, reap, plus refuel.</desc>
