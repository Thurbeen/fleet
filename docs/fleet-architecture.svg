<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" width="880" height="464" role="img" aria-labelledby="title desc">
  <title id="title">How fleet fits together</title>
  <desc id="desc">You prompt Mission Control, the lead session, which reads the registry and dispatches tasks into the queue. The queue gives each worker a brief and gets back a result; the queue pane shows it to you. Workers open pull or merge requests on the forge. The reconciler updates the queue, checks and merges on the forge, and wakes the lead. The loop: intake, brief, dispatch, watch, collect, shepherd, merge, reap, plus refuel.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d1d9e0; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; }
    .lead { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .rec { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .pill { fill: #ffffff; stroke: #818b98; }
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; }
    .t { font-size: 15px; font-weight: 600; }
    .s { fill: #59636e; }
    .l { fill: #59636e; font-size: 11px; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .ln { stroke: #59636e; stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 4 3; }
    .ah { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .box { fill: #151b23; stroke: #3d444d; }
      .lead { fill: #0f2744; stroke: #4493f8; }
      .rec { fill: #231a3a; stroke: #ab7df8; }
      .pill { fill: #0d1117; stroke: #656c76; }
      text { fill: #f0f6fc; }
      .s, .l { fill: #9198a1; }
      .ln { stroke: #9198a1; }
      .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="879" height="463" rx="12"/>

  <!-- row 1 -->
  <rect class="box" x="24" y="24" width="240" height="64" rx="8"/>
  <text class="t" x="40" y="52">You</text>
  <text class="s" x="40" y="72">prompt · review · merge</text>

  <rect class="lead" x="320" y="24" width="240" height="64" rx="8"/>
  <text class="t" x="336" y="52">Mission Control</text>
  <text class="s" x="336" y="72">the lead agent session</text>

  <rect class="box" x="616" y="24" width="240" height="64" rx="8"/>
  <text class="t" x="632" y="52">Registry and settings</text>
  <text class="s" x="632" y="72">repo map · notes · *.conf</text>

  <!-- row 2 -->
  <rect class="box" x="24" y="152" width="240" height="64" rx="8"/>
  <text class="t" x="40" y="180">Queue pane</text>
  <text class="s" x="40" y="200">live view · read-only · F3</text>

  <rect class="box" x="320" y="152" width="240" height="64" rx="8"/>
  <text class="t" x="336" y="180">Queue</text>
  <text class="s" x="336" y="200">topic → tasks · fleet queue</text>

  <rect class="rec" x="616" y="152" width="240" height="64" rx="8"/>
  <text class="t" x="632" y="180">Reconciler</text>
  <text class="s" x="632" y="200">automatic · never dispatches</text>

  <!-- row 3 -->
  <rect class="box" x="320" y="280" width="240" height="72" rx="8"/>
  <text class="t" x="336" y="306">Workers</text>
  <text class="s" x="336" y="324">one session per task</text>
  <text class="s" x="336" y="340">own git worktree · local or remote</text>

  <rect class="box" x="616" y="280" width="240" height="72" rx="8"/>
  <text class="t" x="632" y="306">Forge</text>
  <text class="s" x="632" y="324">GitHub via gh</text>
  <text class="s" x="632" y="340">GitLab via glab</text>

  <!-- arrows -->
  <line class="ln" x1="264" y1="56" x2="318" y2="56" marker-end="url(#a)"/>
  <text class="l c" x="292" y="48">prompt</text>
  <line class="ln dash" x1="616" y1="56" x2="562" y2="56" marker-end="url(#a)"/>
  <text class="l c" x="589" y="48">reads</text>

  <line class="ln dash" x1="144" y1="152" x2="144" y2="90" marker-end="url(#a)"/>
  <line class="ln dash" x1="320" y1="184" x2="266" y2="184" marker-end="url(#a)"/>

  <line class="ln" x1="440" y1="88" x2="440" y2="150" marker-end="url(#a)"/>
  <text class="l" x="448" y="124">dispatch</text>

  <line class="ln" x1="616" y1="184" x2="562" y2="184" marker-end="url(#a)"/>
  <text class="l c" x="589" y="176">updates</text>
  <line class="ln" x1="680" y1="152" x2="542" y2="90" marker-end="url(#a)"/>
  <text class="l" x="628" y="114">wakes</text>

  <line class="ln" x1="410" y1="216" x2="410" y2="278" marker-end="url(#a)"/>
  <text class="l e" x="402" y="252">brief</text>
  <line class="ln" x1="470" y1="280" x2="470" y2="218" marker-end="url(#a)"/>
  <text class="l" x="478" y="252">result</text>

  <line class="ln" x1="560" y1="316" x2="614" y2="316" marker-end="url(#a)"/>
  <text class="l c" x="588" y="308">PR · MR</text>
  <line class="ln" x1="736" y1="216" x2="736" y2="278" marker-end="url(#a)"/>
  <text class="l" x="744" y="252">checks · merges</text>

  <!-- the loop -->
  <text class="t" x="24" y="402">The loop</text>
  <rect class="pill" x="24" y="416" width="70" height="26" rx="13"/>
  <text class="c" x="59" y="433">intake</text>
  <rect class="pill" x="114" y="416" width="70" height="26" rx="13"/>
  <text class="c" x="149" y="433">brief</text>
  <rect class="pill" x="204" y="416" width="70" height="26" rx="13"/>
  <text class="c" x="239" y="433">dispatch</text>
  <rect class="pill" x="294" y="416" width="70" height="26" rx="13"/>
  <text class="c" x="329" y="433">watch</text>
  <rect class="pill" x="384" y="416" width="70" height="26" rx="13"/>
  <text class="c" x="419" y="433">collect</text>
  <rect class="pill" x="474" y="416" width="70" height="26" rx="13"/>
  <text class="c" x="509" y="433">shepherd</text>
  <rect class="pill" x="564" y="416" width="70" height="26" rx="13"/>
  <text class="c" x="599" y="433">merge</text>
  <rect class="pill" x="654" y="416" width="70" height="26" rx="13"/>
  <text class="c" x="689" y="433">reap</text>
  <line class="ln" x1="97" y1="429" x2="111" y2="429" marker-end="url(#a)"/>
  <line class="ln" x1="187" y1="429" x2="201" y2="429" marker-end="url(#a)"/>
  <line class="ln" x1="277" y1="429" x2="291" y2="429" marker-end="url(#a)"/>
  <line class="ln" x1="367" y1="429" x2="381" y2="429" marker-end="url(#a)"/>
  <line class="ln" x1="457" y1="429" x2="471" y2="429" marker-end="url(#a)"/>
  <line class="ln" x1="547" y1="429" x2="561" y2="429" marker-end="url(#a)"/>
  <line class="ln" x1="637" y1="429" x2="651" y2="429" marker-end="url(#a)"/>
  <text class="s c" x="746" y="433">+</text>
  <rect class="pill dash" x="768" y="416" width="70" height="26" rx="13"/>
  <text class="c" x="803" y="433">refuel</text>
</svg>
