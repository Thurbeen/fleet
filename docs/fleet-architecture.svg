<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 588" width="1000" height="588" role="img" aria-labelledby="title desc">
  <title id="title">How fleet fits together</title>
  <desc id="desc">You prompt Mission Control, the lead session, which reads the registry and settings, opens a topic and adds its tasks to the queue. Dispatch starts one worker per task: a thurbox session in its own git worktree, on this machine or another one over ssh. Each worker gets a brief and writes back a result, and opens a pull or merge request on the forge, GitHub or GitLab, which is optional: a local-only fleet publishes a pushed commit or nothing. The Kanban board, Alt+K, shows the queue read-only, with fuel gauges from quota-axi. The reconciler loop watches, collects, shepherds and refuels, never dispatches, and tells the lead when the ready set grows: a typed line, or a mailbox message when the lead is mid-turn. The loop: prompt, topic, tasks, dispatch, watch, collect, shepherd, merge, reap, plus refuel after a token limit and reviewed for a served document.</desc>
  <!--
    Palette: thurbox's built-in doom theme, doom_palette() in
    https://github.com/Thurbeen/thurbox/blob/8f3ac9d185d6288221f6cf1acd05dacb2701b04b/src/session/theme_config/palettes.rs#L289
    bg_dark #1A080A  surface #2A0F12  highlight #40151E  muted #606060
    subtext #A0A0A0  text #E0E0E0  red #FF3B30  bright_red #FF5C54
    bright_green #6EFF6E  cyan #00D9FF  amber #FFA500
    Amber is thurbox's working colour, so it marks the workers.
    GitHub shows README images through its camo proxy as <img>: no scripts and
    no external fonts, so motion is SMIL plus CSS and text is generic monospace.
    Every animation runs on one 14s cycle; prefers-reduced-motion leaves the
    still diagram.
  -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #E0E0E0; font-size: 11.5px; }
    .bg { fill: #1A080A; stroke: #40151E; }
    .box { fill: #2A0F12; stroke-width: 1.5; }
    .t { font-size: 14px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; fill: #E0E0E0; }
    .s { fill: #A0A0A0; }
    .d { fill: #606060; }
    .l { font-size: 11px; fill: #A0A0A0; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .ln { stroke: #606060; stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 4 3; }
    .ah { fill: #606060; }
    .pill { fill: #2A0F12; stroke: #40151E; }
    .side { fill: none; stroke: #606060; stroke-dasharray: 4 3; }
    .grey { stroke: #A0A0A0; }
    .accent { stroke: #FF5C54; } .accent-t { fill: #FF5C54; }
    .green { stroke: #6EFF6E; } .green-t { fill: #6EFF6E; }
    .cyan { stroke: #00D9FF; } .cyan-t { fill: #00D9FF; }
    .amber { stroke: #FFA500; } .amber-t { fill: #FFA500; }
    .red { stroke: #FF3B30; } .red-t { fill: #FF3B30; }

    /* the reconciler's tick: one eighth of a turn per step, forever */
    .tick { transform-box: fill-box; transform-origin: center; animation: tick 4s steps(8) infinite; }
    @keyframes tick { to { transform: rotate(360deg); } }
    /* a worker session's cursor */
    .cur { animation: blink 1.2s steps(2, jump-none) infinite; }
    .cur2 { animation-delay: 0.4s; }
    .cur3 { animation-delay: 0.8s; }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.15; } }
    /* the queue fills with tasks: 2.8s to 4.2s of the cycle */
    .glow { stroke-opacity: 0; animation: glow 14s linear infinite; }
    @keyframes glow { 0%, 19% { stroke-opacity: 0; } 21%, 29% { stroke-opacity: 0.5; } 31%, 100% { stroke-opacity: 0; } }
    /* the forge says merged: 9.8s to 12.6s of the cycle */
    .merged { fill-opacity: 0; animation: merged 14s linear infinite; }
    @keyframes merged { 0%, 69% { fill-opacity: 0; } 70%, 89% { fill-opacity: 1; } 90%, 100% { fill-opacity: 0; } }
    /* the loop strip: each step lit for 1.4s, in order */
    .step { animation: step 14s linear infinite; }
    @keyframes step { 0%, 9% { fill: #40151E; stroke: #FF5C54; } 10%, 100% { fill: #2A0F12; stroke: #40151E; } }
    .s1 { animation-delay: 1.4s; } .s2 { animation-delay: 2.8s; } .s3 { animation-delay: 4.2s; }
    .s4 { animation-delay: 5.6s; } .s5 { animation-delay: 7s; } .s6 { animation-delay: 8.4s; }
    .s7 { animation-delay: 9.8s; } .s8 { animation-delay: 11.2s; }

    @media (prefers-reduced-motion: reduce) {
      .tick, .cur, .glow, .merged, .step { animation: none; }
      .pkt { display: none; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="587" rx="12"/>
