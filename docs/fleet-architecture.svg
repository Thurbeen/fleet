  <text class="t" x="40.5" y="82">You</text>
  <text class="s" x="40.5" y="102">prompt · review · merge</text>
  <text class="s" x="40.5" y="118">reviewed: a served doc is read</text>

  <rect class="box accent" x="360" y="56" width="280" height="76" rx="8"/>
  <text class="t accent-t" x="376.5" y="82">Mission Control</text>
  <text class="s" x="376.5" y="102">the lead agent session</text>
