  <text class="s" x="712.5" y="242">watch · collect · shepherd</text>
  <text class="s" x="712.5" y="258">refuel · reap · reads plan</text>
  <text class="s" x="712.5" y="274">never dispatches · no records</text>
  <g class="tick">
    <circle cx="949.2" cy="218" r="9" fill="none" stroke="#00D9FF" stroke-width="2" stroke-dasharray="9.4 4.7"/>
    <circle cx="949.2" cy="209" r="2.5" fill="#00D9FF"/>
