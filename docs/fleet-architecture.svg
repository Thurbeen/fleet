  <text class="t amber-t" x="376.5" y="374">Workers</text>
  <text class="s" x="376.5" y="394">one thurbox session per task</text>
  <text class="s" x="376.5" y="410">own git worktree per repo</text>
  <text class="s" x="376.5" y="426">this machine, or --host over ssh</text>
  <rect class="cur" x="582.4" y="362" width="7.2" height="12" fill="#FFA500"/>
  <rect class="cur cur2" x="596.8" y="362" width="7.2" height="12" fill="#FFA500"/>
  <rect class="cur cur3" x="611.2" y="362" width="7.2" height="12" fill="#FFA500"/>

  <rect class="box red" x="696" y="348" width="280" height="88" rx="8"/>
  <text class="t red-t" x="712.5" y="374">Forge (optional)</text>
  <text class="s" x="712.5" y="394">GitHub (gh) · GitLab (glab)</text>
  <text class="s" x="712.5" y="410">review-prs session gives verdicts</text>
