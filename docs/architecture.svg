<path d="M490 160 V218"/>
<path d="M375 296 V326 H160 V368"/>
<path d="M490 296 V368"/>
<path d="M605 296 V326 H820 V368"/>
<path d="M820 452 V508"/>
</g>
<g font-size="12" fill="#405367">
<text x="504" y="194">manager verbs</text><text x="35" y="349">Store reads / writes</text>
<text x="505" y="345">pure decisions</text><text x="690" y="349">runtime calls</text>
<text x="833" y="484">thurbox path only</text>
</g>
<text x="30" y="604" font-size="12">Green: pure code. Gray: orchestration / adapters. The fake runtime is file-backed and starts no agent process.</text>
</g>
</svg>
