<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
<title id="title">Fleet execution architecture</title>
<desc id="desc">The CLI constructs store, runtime and forge adapters and calls manager verbs. The manager leases and reconciles Tasks and ChangeRequests through three pure controllers. The Task controller drives sessions through the Runtime port. The ChangeRequest controller mirrors changes through the Forge port. The Forge controller follows declared changes, relays feedback and may request mark-ready. Runtime and Forge use fleet-exec for bounded external processes. All layers share fleet-api contracts.</desc>
<style>
  svg { color-scheme:light dark } .background{fill:#fff} .ink{fill:#182b3d} .muted{fill:#405367}
  .box{stroke:#7890a6;stroke-width:1.5} .pure{fill:#e9f5ef} .orchestration{fill:#edf3f8} .adapter{fill:#f3f4f5} .process{fill:#fff2de}
  .arrow{fill:none;stroke:#405367;stroke-width:2;marker-end:url(#arrow)}
  @media (prefers-color-scheme: light) { .background{fill:#fff} .ink{fill:#182b3d} }
  @media (prefers-color-scheme: dark) { .background{fill:#101820} .ink{fill:#e6edf3} .muted{fill:#a9bdd0} .box{stroke:#71869a} .pure{fill:#173b2d} .orchestration{fill:#1d2a36} .adapter{fill:#202a33} .process{fill:#493517} .arrow{stroke:#a9bdd0} }
</style>
