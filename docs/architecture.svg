<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
<title id="title">Fleet execution architecture</title>
<desc id="desc">The CLI wires store and runtime adapters and calls manager verbs. The manager calls the pure Task controller and the Store and Runtime ports. Runtime calls fleet-exec for bounded thurbox processes. fleet-api defines shared types and ports; the fake runtime starts no process.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#405367"/></marker></defs>
<rect width="980" height="620" rx="12" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="#182b3d">
<text x="30" y="35" font-size="21" font-weight="700">Fleet v2 execution flow</text>
<text x="30" y="60" font-size="14">Runtime call flow. The manager uses ports; the CLI constructs concrete adapters.</text>
<g stroke="#7890a6" stroke-width="1.5">
<rect x="330" y="88" width="320" height="72" rx="8" fill="#edf3f8"/>
<rect x="330" y="220" width="320" height="76" rx="8" fill="#edf3f8"/>
<rect x="30" y="370" width="260" height="82" rx="8" fill="#f3f4f5"/>
<rect x="360" y="370" width="260" height="82" rx="8" fill="#e9f5ef"/>
<rect x="690" y="370" width="260" height="82" rx="8" fill="#f3f4f5"/>
<rect x="690" y="510" width="260" height="70" rx="8" fill="#fff2de"/>
<rect x="30" y="510" width="590" height="70" rx="8" fill="#e9f5ef"/>
</g>
<g text-anchor="middle" font-size="17" font-weight="650">
<text x="490" y="115">fleet-cli</text><text x="490" y="247">fleet-manager</text>
<text x="160" y="398">fleet-store</text><text x="490" y="398">fleet-controllers</text><text x="820" y="398">fleet-runtime</text>
<text x="820" y="537">fleet-exec → thurbox-cli</text><text x="325" y="537">fleet-api: shared pure contract</text>
</g>
<g font-size="13" text-anchor="middle">
<text x="490" y="140">arguments · config · wiring · output</text><text x="490" y="273">verbs · lease · probes · intent/effect/receipt</text>
<text x="160" y="423">Store port: CAS · lease · finalizer</text><text x="490" y="423">TaskController: inputs → plan</text><text x="820" y="423">Runtime port: thurbox or fake</text>
<text x="820" y="559">bounded calls · process tree cleanup</text><text x="325" y="560">Task · observations · plans · Store / Runtime / Clock traits</text>
</g>
