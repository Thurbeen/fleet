<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
<title id="title">ForgeTask controller state machine</title>
<desc id="desc">Phases are Pending, Running, Linked and Concluded. Dispatch creates the Task. A declared change creates a ChangeRequest and enters Linked, where relay and the draft flip happen on every pass. A Task that concludes without declaring a change concludes the ForgeTask from Running. Deletion from any phase deletes the children and removes the record once they are gone.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#405367"/></marker></defs>
<rect width="1040" height="480" rx="12" fill="#ffffff"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="#182b3d">
<text x="24" y="35" font-size="21" font-weight="700">ForgeTask phases</text>
<text x="24" y="60" font-size="14">A phase records progress; relay and the draft flip happen inside Linked and are not phases.</text>
<g stroke="#7890a6" stroke-width="1.5" fill="#edf3f8">
<rect id="pending" x="25" y="150" width="190" height="68" rx="8"/>
<rect id="running" x="295" y="150" width="190" height="68" rx="8"/>
<rect id="linked" x="565" y="150" width="190" height="68" rx="8"/>
<rect id="concluded" x="835" y="150" width="180" height="68" rx="8" fill="#e9f5ef"/>
<rect id="removed" x="565" y="330" width="190" height="68" rx="8" fill="#f0edfa"/>
</g>
<g text-anchor="middle" font-size="17" font-weight="650">
<text x="120" y="177">Pending</text><text x="390" y="177">Running</text><text x="660" y="177">Linked</text>
<text x="925" y="177">Concluded</text><text x="660" y="357">Removed</text>
</g>
<g text-anchor="middle" font-size="12">
<text x="120" y="199">await dispatch</text><text x="390" y="199">Task runs, no change yet</text><text x="660" y="199">relay · flip, per change</text>
<text x="925" y="199">result and all settled</text><text x="660" y="379">children gone; not a phase</text>
</g>
<g fill="none" stroke="#405367" stroke-width="1.8" marker-end="url(#arrow)">
<path id="create-task" d="M215 184 H293"/>
<path id="declare" d="M485 184 H563"/>
<path id="settle" d="M755 184 H833"/>
<path id="no-change" d="M390 150 V100 H925 V148"/>
<path id="delete" d="M660 218 V328"/>
</g>
<g font-size="12" fill="#405367" text-anchor="middle">
<text x="254" y="170">CreateObject(Task)</text>
<text x="524" y="170">fleet declare</text>
<text x="794" y="170">all settled</text>
<text x="657" y="92">Task result and no change declared</text>
<text x="800" y="262">Deletion from ANY phase:</text>
<text x="800" y="280">delete Task and ChangeRequests,</text>
<text x="800" y="298">finalizer holds until both are gone</text>
</g>
<path d="M25 418 H1015" stroke="#c9d3dd"/>
<g font-size="14">
<text x="25" y="446" font-weight="650">Nothing merges, nothing is revived</text>
<text x="25" y="468">Mergeable is reported on the ChangeRequest. A relay gap, a failed flip or a gone child raises NeedsAttention and waits for a person.</text>
</g>
</g>
</svg>
