# Native Rust release tooling. Publication remains held by release-readiness.toml.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (e.g. 1.0.0). Empty = from the commits since the last tag."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build and package every target, publish nothing."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# `bash -eo pipefail` for every script: GitHub's default for a bare `run:` has
# no pipefail, so a refused plan piped into tee would pass. `cargo xtask check
# workflow` holds this.
defaults:
  run:
    shell: bash

# One release at a time, and never a half-cancelled one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      semver: ${{ steps.plan.outputs.semver }}
      newest: ${{ steps.plan.outputs.newest }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # every commit and tag since the last release
      - run: rustup toolchain install
      # Inputs reach the command through the environment, never `${{ }}` in
      # the script. On a push both are empty: no forced version, no dry run.
      - name: Plan
        id: plan
        env:
          FORCED: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$FORCED" ]; then args+=(--version "$FORCED"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          cargo xtask release plan --ref "$GITHUB_REF" "${args[@]}" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The targets crates/fleet-dev/src/release.rs packages; the tooling E2E suite fails a
        # list that differs. Every runner here also runs the Rust checks in
        # ci.yml, which `cargo xtask check workflow` holds.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # Every hosted image here ships rustup. A downloaded installer is never
      # piped into a shell; an image without rustup fails here instead.
      - name: Require rustup
        run: command -v rustup || { echo "::error::this runner image has no rustup"; exit 1; }
      - name: Install the pinned toolchain and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup show active-toolchain
      # musl-gcc, for any C a dependency compiles. Native on both
      # architectures, so no cross and no container.
      - name: Install musl-tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup toolchain install
      # A push to main can arrive without a pull request, and CI runs only on
      # pull requests. So the commit is tested here, on the runner that
      # builds it, before any binary of it is packaged.
      - name: Verify PowerShell gate prerequisite (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo '::error::PowerShell 7 (pwsh) is required for the Windows installer path-policy test; install it and add pwsh to PATH (see CONTRIBUTING.md).'
            exit 1
          fi
          pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149
      - name: Test the commit being released
        run: cargo xtask check rust-test
      # The binary reads FLEET_RELEASE_VERSION at compile time; the manifest
      # stays at 0.0.0.
      - name: Use the static Windows CRT
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Build
        env:
          FLEET_RELEASE_VERSION: ${{ needs.plan.outputs.semver }}
        run: cargo build --release --locked --target "$TARGET" -p fleet-cli --bin fleet
      - name: Check the binary reports its version, then package it
        run: |
          bin="target/$TARGET/release/fleet"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          cargo xtask release smoke --binary "$bin" --version "$VERSION"
          cargo xtask release package --target "$TARGET" --version "$VERSION" --binary "$bin" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  collect:
    name: Checksums
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums over every target
        run: |
          cargo xtask release checksums --version "$VERSION" dist
          {
            echo "### fleet $VERSION"
            echo
            echo '```'
            cat "dist/fleet-$VERSION-checksums.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [plan, collect]
    if: needs.plan.outputs.publish == 'true'
    # A protected environment is where a repository admin can require a
    # person's approval before anything is tagged.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the tag and the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      NEWEST: ${{ needs.plan.outputs.newest }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # SLSA build provenance for every archive and the checksum file, which
      # `gh attestation verify <file> --repo <owner>/fleet` checks.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # The tag is created here, on the commit every archive was built from.
      # A cut behind the highest tag is not marked latest, which is what an
      # installer resolves.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "fleet $VERSION" \
            --generate-notes \
            --latest="$NEWEST" \
            --prerelease="$PRERELEASE"
