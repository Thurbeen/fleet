name: CI

on:
  pull_request:
    branches: [main]

# Cancel a superseded run when a new commit lands on the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole gate, `uv run fleet check`, on a Linux runner and a native
  # Windows one with no bash. One command on both, so a green local run, a
  # green Linux job and a green Windows job all mean the same thing. Unfiltered:
  # "still works on Windows" is a property of every file, and no paths filter
  # can say which change breaks it.
  #
  # Every job carries a `timeout-minutes`: GitHub's default is six hours, and a
  # hung step would hold the required status that long.
  # scripts/lib/check_workflow.py fails a job without one.
  check:
    name: Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv brings Python, PyYAML and the gate's own tools (pytest, ruff, rumdl)
      # from uv.lock, so both runners lint and test with the same versions.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # Lua is the one gate tool not on PyPI: the pane check renders the pane
      # with it, and needs 5.4 for `utf8.codes`.
      #
      # Linux: the runner image preinstalls a google-chrome apt source whose
      # index can go stale and fail `apt-get update` for the whole step, so it
      # is dropped first. The package ships no unversioned `lua`, hence the link.
      - name: Install lua (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.4
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      # Windows: the image ships MSYS2, whose pacman installs Lua in seconds
      # with no third-party action. Chocolatey's `lua` is 5.1, which the pane
      # harness cannot run. `-y` refreshes the image's package list, which
      # otherwise names a revision the mirror drops once a newer one is out.
      - name: Install lua (Windows)
        if: runner.os == 'Windows'
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-lua
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "C:\msys64\ucrt64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # `--frozen`: run against uv.lock as committed, never a fresh resolution.
      - run: uv run --frozen fleet check

  # Single required status check. A branch ruleset requires only "All Checks",
  # so adding or removing jobs never needs a ruleset change — but a new job
  # MUST be added to `needs:` below, or it can fail while this gate reports
  # green. `uv run fleet check workflow` fails one that is not.
  all-checks:
    name: All Checks
    if: always()
    needs:
      - check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed or were cancelled"
            exit 1
          fi
          echo "All checks passed"
